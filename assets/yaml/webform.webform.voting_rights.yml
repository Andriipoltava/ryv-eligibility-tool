      '#text': |
        <p><strong>You can vote!</strong>&nbsp;In Vermont, there are&nbsp;no&nbsp;restrictions on eligibility to vote based on criminal convictions.&nbsp;</p>

        <p><a href="https://www.vote.org/register-to-vote/vermont/">Register to vote with our friends at Vote.org.</a></p>
