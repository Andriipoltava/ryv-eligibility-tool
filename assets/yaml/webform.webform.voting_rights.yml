        <p>On December 12, 2019 Governor Beshear <a href="https://governor.ky.gov/attachments/20191212_Executive-Order_2019-003.pdf">issued an executive order</a> that restores the right to vote to 140,000 citizens&nbsp;who have completed their sentences for non-violent felony convictions from Kentucky state court. If you think your rights may have been restored, you can&nbsp;<a href="https://secure.kentucky.gov/Corrections/VoterEligibility/search">check your rights restoration&nbsp;status here</a>.</p>

        <p>If your result is "inconclusive" you may also go through the questions below to find out if the order restores your right to vote or contact us at <a href="mailto:restoreyourvote@campaignlegal.org">restoreyourvote@campaignlegal.org</a>.</p>
