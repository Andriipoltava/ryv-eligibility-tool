      '#text': |
        <p><span><span><span>Any capital offense; </span></span></span></p>

        <p><span><span><span>Any Class A felony; </span></span></span></p>

        <p><span><span><span>Any Class B felony involving death of the victim or serious physical injury to a victim; </span></span></span></p>

        <p><span><span><span>Any Class B felony involving attempted murder if the victim of the offense is a clearly identifiable peace officer or firefighter acting in the line of duty, regardless of whether an injury results (KRS 506.010);</span></span></span></p>

        <p><span><span><span>Any Felony Sexual Offense (KRS 510);</span></span></span></p>

        <p><span><span><span>Any attempted felony sexual offense (KRS Chapter 510);</span></span></span></p>

        <p><span><span><span>Assault 1st or 2nd (KRS 508.020);</span></span></span></p>

        <p><span><span><span>Assault under extreme emotional disturbance (KRS 508.040(a));</span></span></span></p>

        <p><span><span><span>Bribery in an election (KRS 521);</span></span></span></p>

        <p><span><span><span>Burglary 1st accompanied by commission or attempted commission of an assault described in KRS 508.010, 508.020, 508.032, or 508.060; </span></span></span></p>

        <p><span><span><span>Burglary 1st accompanied by commission or attempted commission of kidnapping (KRS 509.040);</span></span></span></p>

        <p><span><span><span>Criminal abuse 1st (KRS 508.100); </span></span></span></p>

        <p><span><span><span>Fetal Homicide 1st, 2nd, 3rd, or 4th (KRS 507A);</span></span></span></p>

        <p><span><span><span>Human Trafficking (KRS 529.100);</span></span></span></p>

        <p><span><span><span>Manslaughter 1st or 2nd (KRS 507.030-.040);</span></span></span></p>

        <p><span><span><span>Murder (KRS 507.020);</span></span></span></p>

        <p><span><span><span>Promoting a sexual performance by a minor (KRS 531.320);</span></span></span></p>

        <p><span><span><span>Unlawful transaction with a minor 1st (KRS 530.064(1)(a));</span></span></span></p>

        <p><span><span><span>Use of a minor in a sexual performance (KRS 531.310);</span></span></span></p>

        <p><span><span><span>Reckless Homicide (KRS 507.050);</span></span></span></p>

        <p><span><span><span>Robbery 1st (KRS 515.020);</span></span></span></p>

        <p><span><span><span>Strangulation 1st (KRS 508.170);</span></span></span></p>

        <p><span><span><span>Treason.</span></span></span></p>
      '#format': basic_html
    ky_cant_vote_fines:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="ky_outstanding_fees_fines_and_or_restitution"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#admin_title': '[ky_cant_vote_violent]'
      '#text': |
        <p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to register to vote under Governor Beshear's executive order.&nbsp;You may still petition the Governor&nbsp;to have your rights restored if you have completed your sentence and do not owe fines or restitution. <a href="https://corrections.ky.gov/Probation-and-Parole/Pages/CivilRights.aspx">Click here for more information about the petition process</a>.</p>
      '#format': basic_html
    ky_currently_have_any_indictments_or_pending_charges_against:
      '#type': webform_buttons
      '#title': 'At the time of discharge from your sentence, did you have any pending felony charges or arrests against you? '
      '#options': yes_no
      '#states':
        visible:
          ':input[name="ky_outstanding_fees_fines_and_or_restitution"]':
            value: 'No'
      '#admin_title': 'KENTUCKY Charges'
    ky_no_vote_pending:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="ky_currently_have_any_indictments_or_pending_charges_against"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, because you had a pending felony or arrest at the time of discharge, you are&nbsp;<strong>not</strong>&nbsp;eligible to register to vote under the Governor's executive order.&nbsp;Please contact us to help resolve this: 202-857-0314 or restoreyourvote@campaignlegal.org.</p>
      '#format': basic_html
    processed_text_27:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="ky_currently_have_any_indictments_or_pending_charges_against"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#admin_title': '[can_vote_order]'
      '#text': |
        <p><strong>You can vote!</strong> Governor Beshear's Executive Order on December 12, 2019 has restored the right to vote to anyone convicted of a Kentucky state felony who has (1) completed their sentence including probation and parole, (2) has not been convicted of treason, bribery, or a violent crime, and (3) does not have any felony charges or arrests pending.</p>

        <p>You can confirm your status on the <a href="https://secure.kentucky.gov/Corrections/VoterEligibility/search">KY Dept. of Corrections' portal here.</a>&nbsp;Even if you are not listed as restored there, however, if you meet the above criteria on all of your felony convictions, you have the right to vote.</p>

        <p>To register to vote, <a href="https://www.vote.org/state/kentucky/">visit our friends at vote.org</a>.</p>
      '#format': basic_html
    violent_crime_maybe:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="ky_outstanding_fees_fines_and_or_restitution"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><span><span>If you have questions about whether your conviction is on this list, contact us at (202) 857-0314 or <a href="mailto:RestoreYourVote@CampaignLegal.org">RestoreYourVote@CampaignLegal.org</a>.</span></span></p>

        <p><a href="https://secure.kentucky.gov/Corrections/VoterEligibility/search">You can also check your voting rights status here</a>.</p>

        <p><span><span>You can <a href="https://courts.ky.gov/aoc/criminalrecordreports/pages/default.aspx">use this database to look up your conviction</a>. Alternatively, you may mail a request or make an in-person request at the <a href="https://courts.ky.gov/aoc/Pages/default.aspx">Administrative Office of the Courts</a>. The fee for a criminal record report is $25.</span></span></p>
      '#format': basic_html
