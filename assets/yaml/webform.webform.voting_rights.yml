      '#text': |
        <p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote right now. Your right to vote will be restored when you are released from incarceration, even if you are still on probation or parole.</p>
      '#format': basic_html
    utah_can_vote_post_prison:
