        <p>In&nbsp;Utah, no one is disenfranchised for&nbsp;misdemeanors&nbsp;or&nbsp;any other convictions than felonies. If you&nbsp;are incarcerated but have not been convicted of a felony, you&nbsp;are still eligible to vote. That’s true even if you&nbsp;have been charged with a felony.&nbsp;</p>

        <p><a href="https://www.vote.org/register-to-vote/utah/">Register to vote with our friends at Vote.org.</a></p>
      '#format': basic_html
    are_you_currently_incarcerated_for_your_felony_conviction_utah:
      '#type': webform_buttons
      '#title': 'Are you currently incarcerated for your felony conviction?'
      '#options': yes_no
      '#states':
        visible:
