  state_virginia:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: VA
    northam_exec:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: VA
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': '<p>On January 22, 2026, <a href="https://protectdemocracy.org/work/federal-judge-restores-thousands-of-virginians-voting-rights-in-historic-ruling/" target="_blank">a federal judge found that Virginia''s felony disenfranchisement scheme largely violates federal law</a>. Starting June 1, 2026, Virginia may no longer deny the right to vote to all people convicted of felonies; instead, only those with certain felony convictions lose the right to vote.</p><p>The state has determined that <a href="https://www.elections.virginia.gov/media/electionadministration/electionlaw/Virginia-Crimes-Applicable-to-Common-Law-Felonies-in-1870.pdf">any felony on this list disqualifies a person from voting</a>. If you have a conviction on the list, <a href="https://ror.solutions.virginia.gov/">check your restoration status or apply for clemency here.</a></p><p>The state has determined that <a href="https://www.elections.virginia.gov/media/electionadministration/electionlaw/Virginia-Crimes-Requiring-Additional-Evaluation.pdf">any felony on this list may be disqualifying</a>. If you have a conviction on the list, you may fill out a voter registration, disclosing your conviction, and the state will determine if your conviction is disqualifying. Election officials will contact you by mail for more information.</p><p>If you do not have a conviction on either list and all of your felonies were in Virginia state court, you can register to vote. This is true even if&nbsp;you have been told in the past that you cannot vote.</p><p>If you have convictions from other jurisdictions (other states or federal courts), contact us.</p><p>Please reach out to us with any questions or concerns about your status or the application process: <a href="mailto:email:restoreyourvote@campaignlegal.org" target="_blank">RestoreYourVote@CampaignLegalCenter.org</a>.</p>'
      '#format': basic_html
    have_you_been_convicted_of_a_felony_va:
      '#type': webform_buttons
      '#title': 'Have you been convicted of a felony? '
      '#options': yes_no
      '#states':
        invisible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: VA
      '#admin_title': 'VIRGINIA Felony'
    virginia_votes:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_va"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!&nbsp;</strong></p>

        <p>In Virginia, no one loses the right to vote for misdemeanors or any other convictions than felonies. If you are incarcerated but have not been convicted of any felony, you are still eligible to vote.</p>

        <p><a href="https://www.vote.org/register-to-vote/virginia/">Register to vote with our friends at Vote.org.&nbsp;</a></p>
      '#format': basic_html
    where_was_your_felony_conviction_s:
      '#type': webform_buttons
      '#title': 'Where was your felony conviction(s)?'
      '#options':
        'Virginia state court': 'Virginia state court'
        "Another state's court": "Another state's court"
        'Federal court': 'Federal court'
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_va"]':
            value: 'Yes'
    virginia_oos:
      '#type': processed_text
      '#states':
        visible:
          - ':input[name="where_was_your_felony_conviction_s"]':
              value: "Another state's court"
          - or
          - ':input[name="where_was_your_felony_conviction_s"]':
              value: 'Federal court'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': "<p>If your voting rights have been restored in the jurisdiction where you were convicted, your right vote is also restored under Virginia law.</p><p>If your conviction was in another state's court, check to see if you have the right to vote in that state by changing the state selection above. If you were convicted in multiple other states, you must be restored in each to be restored in Virginia.</p><p>If your conviction was in federal court, a presidential pardon can restore your right to vote.</p>"
      '#format': full_html
    has_your_right_to_vote_been_restored_in_the_jurisdiction_s_of_yo:
      '#type': webform_buttons
      '#title': 'Has your right to vote been restored in the jurisdiction(s) of your conviction?'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
      '#states':
        visible:
          - ':input[name="where_was_your_felony_conviction_s"]':
              value: "Another state's court"
          - or
          - ':input[name="where_was_your_felony_conviction_s"]':
              value: 'Federal court'
      '#admin_title': 'VIRGINIA restored oos'
    are_currently_incarcerated_for_your_felony_conviction_va:
      '#type': webform_buttons
      '#title': 'Are currently incarcerated for your felony conviction? '
      '#options': yes_no
      '#states':
        visible:
          - ':input[name="has_your_right_to_vote_been_restored_in_the_jurisdiction_s_of_yo"]':
              value: 'No'
          - or
          - ':input[name="where_was_your_felony_conviction_s"]':
              value: 'Virginia state court'
      '#admin_title': 'VIRGINIA Incarcerated'
    virginia_no_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="are_currently_incarcerated_for_your_felony_conviction_va"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you are <strong>not</strong> eligible to vote right now. You will be eligible to apply to the Governor’s office to restore your right to vote when you have completed any prison time for a felony conviction.</p>
      '#format': basic_html
    va_rights_restoration:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="are_currently_incarcerated_for_your_felony_conviction_va"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>You are eligible to <a href="https://solutions.virginia.gov/RestorationOfRights/Contacts/Apply"><strong>apply</strong></a> to the Governor’s office to restore your right to vote.</p>

        <p>You can <a href="https://solutions.virginia.gov/RestorationOfRights/search">check to see if your right to vote has been restored here</a>.</p>

        <p>You can <a href="https://solutions.virginia.gov/RestorationOfRights/Contacts/Apply">apply to restore your right to vote here</a>.</p>

        <p>For more information and assistance, you can <a href="https://revivemyvote.wm.edu/">visit Revive My Vote</a>&nbsp;or call: 844-932-8683.</p>
      '#format': basic_html
    virginia_votes_oos:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="has_your_right_to_vote_been_restored_in_the_jurisdiction_s_of_yo"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': '<p><strong>You can vote!</strong></p><p>If you are a Virginia resident convicted of a felony in another state or in federal court, your right to vote in Virginia is restored if the jurisdiction of conviction has restored your right to vote. In other words, if you were convicted in another state, but your right to vote has been restored in that state, you have the right to vote in Virginia, if otherwise eligible. If you have a federal conviction but have received a presidential pardon, you have the right to vote in Virginia, if otherwise eligible. If you were convicted in multiple jurisdictions, you must be restored in each or otherwise be restored by the governor of Virginia.</p><p><a style="-webkit-text-stroke-width:0px;background-color:rgb(221, 237, 242);border-style:solid;border-width:0px;box-shadow:rgb(28, 45, 67) 0px -2px 0px inset;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;transition:box-shadow 0.25s, color 0.25s;white-space:normal;widows:2;word-spacing:0px;" href="https://www.vote.org/register-to-vote/virginia/">Register to vote with our friends at Vote.org.&nbsp;</a></p>'
      '#format': full_html
