        visible:
          ':input[name="north_carolina_probation"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can register to vote!</strong></p>

        <p>The right to vote is automatically restored in North Carolina upon completion of probation or parole for any felony convictions.</p>

        <p>You can register to vote with our friends at <a href="https://www.vote.org/register-to-vote/north-carolina/">vote.org here.</a></p>

        <p>Note: The North Caroline Supreme Court has overruled a lower court opinion allowing North Carolinians on felony probation or parole to vote. Now, an individual must discharge probation or parole to have the right to vote restored. For more information on that case, visit&nbsp;<a href="https://forwardjustice.org/stories/2020-voting-resources/">Forward Justice</a>.</p>
      '#format': basic_html
    nc_no_vote_probation:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="north_carolina_probation"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You are not eligible to vote yet. </strong>In North Carolina, voting rights are restored after completion of probation or parole for any felony convictions.</p>

        <p>Note that the North Caroline Supreme Court has overruled a lower court opinion allowing North Carolinians on felony probation or parole to vote. Now, an individual must discharge probation or parole to have the right to vote restored. If you registered to vote before the decision was overruled but are still serving probation or parole, <strong>you should not vote</strong> and you shoud write to your local election officer to ask to be removed from the voter rolls. For more information on that case, visit&nbsp;<a href="https://forwardjustice.org/stories/2020-voting-resources/">Forward Justice</a>.&nbsp;</p>
      '#format': basic_html
