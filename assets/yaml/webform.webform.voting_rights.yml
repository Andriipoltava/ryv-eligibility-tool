          - message--path-end
      '#text': '<p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px 0px 1.125rem;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">You are eligible for automatic restoration of civil rights, but under a new law passed in 2022, you should obtain a non-discretionary court order confirming that you are eligible.</p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px 0px 1.125rem;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Note: Since your conviction was in another state, your civil rights may have been automatically restored by the law in the state of conviction. Contact us to check before you petition the court in Arizona as you may already be eligible to vote.</p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">You can apply fora non-discretionary order confirming your eligibility in the superior court in the Arizona county in which you reside. The court should grant the petition without receiving a response from the state or holding a hearing.</p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">You can find your </span><a style="background-color:transparent;border-style:solid;border-width:0px;box-shadow:rgb(28, 45, 67) 0px -2px 0px inset;box-sizing:inherit;color:rgb(28, 45, 67);overflow-wrap:break-word;text-decoration:none;transition:box-shadow 0.25s, color 0.25s;" href="https://www.azcourts.gov/clerkofcourt/Contact-Us"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">county’s clerk of court here</span></a><span style="border-style:solid;border-width:0px;box-sizing:inherit;">.</span></p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">With your application, you should include either your absolute discharge or documentation of your discharge from probation.&nbsp;</span></p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">For Maricopa County, you can </span><a style="background-color:transparent;border-style:solid;border-width:0px;box-shadow:rgb(28, 45, 67) 0px -2px 0px inset;box-sizing:inherit;color:rgb(28, 45, 67);overflow-wrap:break-word;text-decoration:none;transition:box-shadow 0.25s, color 0.25s;" href="https://superiorcourt.maricopa.gov/media/h0whkc0m/crrr1z.pdf"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">download the form to apply here</span></a><span style="border-style:solid;border-width:0px;box-sizing:inherit;">.&nbsp;</span></p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">For all other counties, you </span><a style="background-color:transparent;border-style:solid;border-width:0px;box-shadow:rgb(28, 45, 67) 0px -2px 0px inset;box-sizing:inherit;color:rgb(28, 45, 67);overflow-wrap:break-word;text-decoration:none;transition:box-shadow 0.25s, color 0.25s;" href="https://campaignlegal.org/arizona-voting-rights-restoration"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">may use the sample form here</span></a><span style="border-style:solid;border-width:0px;box-sizing:inherit;">.</span></p>'
      '#format': full_html
    out_of_state_petition:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="arizona_court_location"]':
            value: Other
          ':input[name="az_multi_completed_your_sentence_including_any_parole_and_or_pro"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': '<p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px 0px 1.125rem;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="border-style:solid;border-width:0px;box-sizing:inherit;font-family:AvenirLTPro-Black, sans-serif;font-style:normal;font-weight:normal;">You are eligible to apply to restore your right to vote.</strong>&nbsp;</p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px 0px 1.125rem;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><span style="-webkit-text-stroke-width:0px;background-color:rgb(221, 237, 242);color:rgb(28, 45, 67);display:inline !important;float:none;font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Please note that because your conviction was in another state, your right to vote may already be restored if your civil rights have been restored in the state of conviction. Civil rights restoration entails more than restoration of the right to vote alone. Please contact us to find out if you have already had your civil rights restored under the laws of your state of conviction.</span></p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">If your civil rights have not been restored in the state of conviction, you should submit the application to restore your right to vote in the superior court where you currently reside.&nbsp;The process may take up to 90 days.&nbsp;&nbsp;</p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">You can <a style="background-color:transparent;border-style:solid;border-width:0px;box-shadow:rgb(28, 45, 67) 0px -2px 0px inset;box-sizing:inherit;color:rgb(28, 45, 67);overflow-wrap:break-word;text-decoration:none;transition:box-shadow 0.25s, color 0.25s;" href="https://www.azcourts.gov/clerkofcourt/Contact-Us">find your county’s clerk of court here</a>.&nbsp;</p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">With your application, you should include either your absolute discharge or documentation of your discharge from probation.&nbsp;&nbsp;</p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">For Maricopa County, you can <a style="background-color:transparent;border-style:solid;border-width:0px;box-shadow:rgb(28, 45, 67) 0px -2px 0px inset;box-sizing:inherit;color:rgb(28, 45, 67);overflow-wrap:break-word;text-decoration:none;transition:box-shadow 0.25s, color 0.25s;" href="https://superiorcourt.maricopa.gov/media/h0whkc0m/crrr1z.pdf">download the form&nbsp;to apply&nbsp;here</a>.&nbsp;&nbsp;</p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">For all other counties, you may use the <a style="background-color:transparent;border-style:solid;border-width:0px;box-shadow:rgb(28, 45, 67) 0px -2px 0px inset;box-sizing:inherit;color:rgb(28, 45, 67);overflow-wrap:break-word;text-decoration:none;transition:box-shadow 0.25s, color 0.25s;" href="https://campaignlegal.org/arizona-voting-rights-restoration">sample form here</a>.&nbsp;</p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">If you’d like more support, please contact <a style="background-color:transparent;border-style:solid;border-width:0px;box-shadow:rgb(28, 45, 67) 0px -2px 0px inset;box-sizing:inherit;color:rgb(28, 45, 67);overflow-wrap:break-word;text-decoration:none;transition:box-shadow 0.25s, color 0.25s;" href="mailto:restoreyourvote@campaignlegalcenter.org">Blair</a>&nbsp;for assistance.&nbsp;</p>'
      '#format': full_html
  state_arkansas:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: Arkansas
    arkansas_have_you_been_convicted_of_a_felony_:
      '#type': webform_buttons
      '#title': 'Have you been convicted of a felony?'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: Arkansas
      '#admin_title': 'ARKANSAS Have you been convicted of a felony'
    arkansas_you_can_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="arkansas_have_you_been_convicted_of_a_felony_"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!&nbsp;</strong></p>

        <p>In&nbsp;Arkansas, no one&nbsp;loses the right to vote&nbsp;for misdemeanors or any other convictions than felonies. If you&nbsp;are incarcerated but have not been convicted of a felony, you&nbsp;are still eligible to vote. That’s true even if you have been charged with a felony.&nbsp;</p>

        <p><a href="https://www.vote.org/register-to-vote/arkansas/">Register to vote with our friends at Vote.org.</a>&nbsp;</p>
      '#format': basic_html
    ar_are_you_currently_incarcerated_for_your_felony_conviction_:
      '#type': webform_buttons
      '#title': 'Are you currently incarcerated for your felony conviction?'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="arkansas_have_you_been_convicted_of_a_felony_"]':
            value: 'Yes'
      '#admin_title': 'ARKANSAS Currently Incarcerated'
    arkansas_you_cant_vote_incarcerated:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="ar_are_you_currently_incarcerated_for_your_felony_conviction_"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you&nbsp;are&nbsp;not&nbsp;eligible to vote right now. Your right to vote will be restored when your sentence ends, including any parole and/or probation and payment of all court costs, fines, and/or restitution.</p>
      '#format': basic_html
    arkansas_are_you_currently_on_probation_or_on_parole_:
      '#type': webform_buttons
      '#title': 'Are you currently on probation or on parole?'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="ar_are_you_currently_incarcerated_for_your_felony_conviction_"]':
            value: 'No'
      '#admin_title': 'ARKANSAS parole or probation'
    arkansas_you_cant_vote_parole_probation:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="arkansas_are_you_currently_on_probation_or_on_parole_"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you&nbsp;are&nbsp;not&nbsp;eligible to vote right now. Your right to vote will be restored when your sentence ends, including any parole and/or probation&nbsp;and payment of all court costs, fines, and/or restitution.&nbsp;&nbsp;</p>
      '#format': basic_html
    arkansas_probations_parole_fees_court_cost_restitution:
      '#type': webform_buttons
      '#title': 'Have you paid all probation/parole fees, court costs, fines, and/or restitution?'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="arkansas_are_you_currently_on_probation_or_on_parole_"]':
            value: 'No'
      '#admin_title': 'ARKANSAS probation parole court fees'
    arkansas_you_cant_vote_parole_probation_fees:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="arkansas_probations_parole_fees_court_cost_restitution"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you&nbsp;are&nbsp;not&nbsp;eligible to vote right now. Your right to vote will be restored when your sentence ends, including any parole and/or probation and payment of all court costs, fines, and/or restitution.&nbsp;</p>
      '#format': basic_html
    arkansas_you_can_vote_probatio_parole_fees:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="arkansas_probations_parole_fees_court_cost_restitution"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You&nbsp;are eligible to restore your right to vote!</strong> You just need to complete a few final steps.&nbsp;&nbsp;</p>

        <p>Step One:</p>

        <p>Gather proof that you have completed your felony sentence, including probation, parole, and&nbsp;payment of all fines and fees related to your felony convictions.&nbsp;&nbsp;</p>

        <p>If you do not have those documents, contact the Department of Corrections (870-267-6999), the Department of Community Correction (501-682-9510), or your&nbsp;local&nbsp;probation office to request proof/documentation that you have&nbsp;completed your sentence&nbsp;paid all&nbsp;related&nbsp;fees, court costs, fines, and/or restitution.&nbsp;&nbsp;</p>

        <p>These agencies&nbsp;are required by law to provide&nbsp;you with such documentation.&nbsp;</p>

        <p>Step Two:</p>

        <p>Deliver your proof of completion of your sentence along with a voter registration form to your local county clerk.&nbsp;</p>

        <p>You can find a list of county clerks <a href="http://www.sos.arkansas.gov/uploads/County_Clerk_Contact_List_-_Rev._1_.23_.2018_.pdf">here</a>. You can mail the form and proof of completion to the county clerk or deliver them in person. The voter registration form will be available at the county clerk’s office or you can print&nbsp;it out <a href="https://www.sos.arkansas.gov/uploads/elections/ArkansasVoterRegistrationApplication.pdf">here</a>. The form is available in Spanish <a href="https://www.sos.arkansas.gov/uploads/elections/voter_reg_ap_ar_spanish.pdf">here</a>.&nbsp;</p>
      '#format': basic_html
