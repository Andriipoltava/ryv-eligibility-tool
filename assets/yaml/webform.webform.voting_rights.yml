      '#format': basic_html
    currently_incarcerated_for_your_felony_conviction:
      '#type': webform_buttons
      '#title': 'Are you currently incarcerated for your felony conviction?'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
      '#states':
        visible:
          ':input[name="alaska_convicted_of_one_of_the_following_felonies"]':
            value: 'Yes'
      '#admin_title': 'ALASKA Are you currently incarcerated '
    alaska_incarcerated_cant_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="currently_incarcerated_for_your_felony_conviction"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote right now. Your right to vote will be restored when you complete your sentence, including parole and/or probation.&nbsp;</p>
      '#format': basic_html
    alaska_currently_on_parole_or_probation:
      '#type': webform_buttons
      '#title': 'Are you currently on parole or probation?'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="currently_incarcerated_for_your_felony_conviction"]':
            value: 'No'
      '#admin_title': 'ALASKA Are you on parole or probation'
    alaska_cant_vote_parole:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="alaska_currently_on_parole_or_probation"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote right now. Your right to vote will be restored when your parole and probation end.&nbsp;</p>
      '#format': basic_html
    alaska_you_can_vote_after_parole:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="alaska_currently_on_parole_or_probation"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': '<p><strong>You can vote!</strong>&nbsp;In&nbsp;Alaska, people with disqualifying felony convictions get their right to vote back after they complete their sentence. Since you are no longer on parole or probation, you are eligible to vote.&nbsp;</p><p>If this is your first time registering to vote since your discharge, you will need to register in-person or by mail and&nbsp;include a copy of your "discharge papers"--proof that you have completed your sentence. <a href="https://www.elections.alaska.gov/contact-information/">Find your local elections division office here.</a></p><p>Otherwise, you may <a href="https://www.vote.org/state/alaska/">r</a><a href="https://www.vote.org/register-to-vote/alaska/">egister to vote with our friends at vote.org.&nbsp;</a></p>'
      '#format': basic_html
  state_arizona:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: Arizona
    az_on_the_ground:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: Arizona
        invisible:
          - ':input[name="have_you_been_convicted_of_a_felony_arizona"]':
              value: 'Yes'
          - xor
          - ':input[name="have_you_been_convicted_of_a_felony_arizona"]':
              value: 'No'
          - xor
          - ':input[name="have_you_been_convicted_of_a_felony_arizona"]':
              value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><!--[if !vml]--><!--[endif]--><!--[if !vml]--><!--[endif]--></p>

        <p>If you would like to start advocating for people seeking to restore their rights, please check out the <a href="https://campaignlegal.org/story/toolkit-activists-helping-people-felony-convictions-vote-arizona">Arizona Activist Toolkit</a>!</p>
      '#format': basic_html
    have_you_been_convicted_of_a_felony_arizona:
      '#type': webform_buttons
      '#title': 'Have you been convicted of a felony?'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
        Maybe: "I Don't Know "
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: Arizona
      '#admin_title': 'ARIZONA Conviction'
    arizona_court_location:
      '#type': webform_buttons
      '#title': 'Were you convicted in an Arizona state court, a federal court, a state court in a different state than Arizona, or in multiple settings?'
      '#help': '<a href="mailto:restoreyourvote@campaignlegalcenter.org?subject=Arizona">Please email us if you have any questions.&nbsp;</a>'
      '#options':
        Arizona: 'Arizona State Court '
        Federal: Federal
        Other: 'Other State Court'
        Multiple: 'Multiple Courts'
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_arizona"]':
            value: 'Yes'
      '#admin_title': 'ARIZONA Court Location'
    az_multi_switch:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="arizona_court_location"]':
            value: Other
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': '<p><span>Your right to vote may already be restored if your civil rights have been restored in the state of conviction. Civil rights restoration entails more than restoration of the right to vote alone. Please contact us to find out if you have already had your civil rights restored under the laws of your state of conviction.</span></p><p><span>If you have not had your civil rights restored in the state of conviction, you should follow the questions below to see if you qualify for automatic restoration under Arizona law or if you are eligible to apply to restore your right to vote in court in the Arizona county where you live.</span></p>'
      '#format': basic_html
    arizona_database:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_arizona"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Use <a href="//apps.supremecourt.az.gov/publicaccess/caselookup.aspx">this database to look up&nbsp;your&nbsp;in-state&nbsp;conviction</a>.&nbsp;&nbsp;</p>

        <p>If you’d like more support, please contact <a href="mailto:restoreyourvote@campaignlegalcenter.org">Blair</a> for assistance.</p>
      '#format': basic_html
    arizona_votes:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_arizona"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!</strong></p>

        <p>In&nbsp;Arizona, no one&nbsp;loses the right to vote&nbsp;for misdemeanors or any other convictions than felonies. If you are incarcerated but have not been convicted of a felony, you are still <strong>eligible to vote</strong>. That’s true even if you have been charged with a felony.&nbsp;</p>

        <p><a href="https://www.vote.org/register-to-vote/arizona/">Register to vote with our friends at Vote.org.</a></p>

        <p>If you’d like more support, please contact <a href="mailto:restoreyourvote@campaignlegalcenter.org">Blair</a>&nbsp;for assistance.&nbsp;</p>
      '#format': basic_html
    is_this_your_first_felony_conviction_arizona:
      '#type': webform_buttons
      '#title': 'Do you only have a single felony conviction? '
      '#help': '<p>If you were convicted of multiple felonies arising from the same incident, answer no.&nbsp;</p>'
      '#options': yes_no
      '#states':
        visible:
          - ':input[name="arizona_court_location"]':
              value: Arizona
          - or
          - ':input[name="arizona_court_location"]':
              value: Other
          - or
          - ':input[name="arizona_court_location"]':
              value: Federal
      '#admin_title': 'ARIZONA First'
    are_you_currently_incarcerated_for_your_felony_conviction_arizon:
      '#type': webform_buttons
      '#title': 'Are you currently incarcerated for your felony conviction?'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="is_this_your_first_felony_conviction_arizona"]':
            value: 'Yes'
      '#admin_title': 'ARIZONA Incarcerated'
    arizona_no_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="are_you_currently_incarcerated_for_your_felony_conviction_arizon"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': '<p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote right now. Since this is your first felony conviction, your right to vote will be restored when your sentence ends, including any parole and/or probation and payment of all victim restitution.&nbsp;</p><p>If your conviction was in federal court or another state, you may need to file a petition to confirm your eligibility once you have finished your sentence. If you’d like more support, please contact us&nbsp;for assistance.</p>'
      '#format': basic_html
    arizona_completed_your_sentence_including_any_parole_and_or_pro:
      '#type': webform_buttons
      '#title': 'Have you completed your sentence, including any parole and/or probation?'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="are_you_currently_incarcerated_for_your_felony_conviction_arizon"]':
            value: 'No'
      '#admin_title': 'ARIZONA Parole'
    arizona_no_vote_parole:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="arizona_completed_your_sentence_including_any_parole_and_or_pro"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': '<p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote right now. Since this is your first felony conviction, your right to vote will be restored when your sentence ends, including any parole and/or probation and payment of any victim restitution.&nbsp;</p><p>If you’d like more support, please contact <a href="mailto:restoreyourvote@campaignlegalcenter.org">Blair</a>&nbsp;for assistance.</p>'
      '#format': basic_html
    arizona_paid_all_required_fines_and_restitutions:
      '#type': webform_buttons
      '#title': 'Do you own any victim restitution on your felony conviction?'
      '#help': '<p>Arizona courts convert unpaid fines, fees, and court costs into "criminal restitution." "Criminal restitution" is not the same as "victim restitution." If you owe, criminal restitution but not victim restitution, select "No."</p>'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="arizona_completed_your_sentence_including_any_parole_and_or_pro"]':
            value: 'Yes'
          ':input[name="is_this_your_first_felony_conviction_arizona"]':
            value: 'Yes'
      '#admin_title': 'ARIZONA Fines'
    az_no_vote_fines:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="arizona_paid_all_required_fines_and_restitutions"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': '<p><span>You are eligible to apply to restore your right to vote. You may apply to restore your right to vote with the county clerk in the county where you were convicted, if you were convicted in Arizona state court, or in the county where you reside, if you were convicted in federal court or out of state.</span></p><p><span>If you were convicted of felonies in more than one county, you should apply in each county for the convictions in that county. The process may take up to 90 days.&nbsp;</span></p><p><span>You can find your </span><a href="https://www.azcourts.gov/clerkofcourt/Contact-Us"><span>county’s clerk of court here</span></a><span>.</span></p><p><span>With your application, you should include either your absolute discharge or documentation of your discharge from probation.&nbsp;</span></p><p><span>For Maricopa County, you can </span><a href="https://superiorcourt.maricopa.gov/media/h0whkc0m/crrr1z.pdf"><span>download the form to apply here</span></a><span>.&nbsp;</span></p><p><span>For all other counties, you </span><a href="https://campaignlegal.org/arizona-voting-rights-restoration"><span>may use the sample form here</span></a><span>.</span></p>'
      '#format': basic_html
    arizona_votes_post_first:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="arizona_paid_all_required_fines_and_restitutions"]':
            value: 'No'
          ':input[name="arizona_court_location"]':
            value: Arizona
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': '<p><strong>You can vote!</strong>&nbsp;</p><p>In&nbsp;Arizona, people with only one conviction are immediately eligible to register to vote once they complete their sentence, including parole, probation, and payment of victim&nbsp;restitution. (Fines and fees no longer impact the right to vote in Arizona.)</p><p><a href="https://www.vote.org/register-to-vote/arizona/">Register to vote with our friends at Vote.org.</a></p><p>If you’d like more support (or want to share your story of registering to vote!), please contact <a href="mailto:restoreyourvote@campaignlegalcenter.org">Blair</a>&nbsp;for assistance.&nbsp;</p>'
      '#format': basic_html
    application_federal:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="arizona_court_location"]':
            value: Federal
          ':input[name="arizona_paid_all_required_fines_and_restitutions"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': '<p>You are eligible for automatic restoration of civil rights, but under a new law passed in 2022, you should obtain a non-discretionary court order confirming that you are eligible.</p><p>You can apply for that order in the superior court in the county in which you reside. The court should grant the petition without receiving a response from the state or holding a hearing.</p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">You can find your </span><a style="background-color:transparent;border-style:solid;border-width:0px;box-shadow:rgb(28, 45, 67) 0px -2px 0px inset;box-sizing:inherit;color:rgb(28, 45, 67);overflow-wrap:break-word;text-decoration:none;transition:box-shadow 0.25s, color 0.25s;" href="https://www.azcourts.gov/clerkofcourt/Contact-Us"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">county’s clerk of court here</span></a><span style="border-style:solid;border-width:0px;box-sizing:inherit;">.</span></p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">With your application, you should include either your absolute discharge or documentation of your discharge from probation.&nbsp;</span></p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">For Maricopa County, you can </span><a style="background-color:transparent;border-style:solid;border-width:0px;box-shadow:rgb(28, 45, 67) 0px -2px 0px inset;box-sizing:inherit;color:rgb(28, 45, 67);overflow-wrap:break-word;text-decoration:none;transition:box-shadow 0.25s, color 0.25s;" href="https://superiorcourt.maricopa.gov/media/h0whkc0m/crrr1z.pdf"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">download the form to apply here</span></a><span style="border-style:solid;border-width:0px;box-sizing:inherit;">.&nbsp;</span></p><p style="-webkit-text-stroke-width:0px;border-style:solid;border-width:0px;box-sizing:inherit;color:rgb(28, 45, 67);font-family:AvenirLTPro-Medium, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:1.125rem 0px 0px;orphans:2;overflow-wrap:break-word;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">For all other counties, you </span><a style="background-color:transparent;border-style:solid;border-width:0px;box-shadow:rgb(28, 45, 67) 0px -2px 0px inset;box-sizing:inherit;color:rgb(28, 45, 67);overflow-wrap:break-word;text-decoration:none;transition:box-shadow 0.25s, color 0.25s;" href="https://campaignlegal.org/arizona-voting-rights-restoration"><span style="border-style:solid;border-width:0px;box-sizing:inherit;">may use the sample form here</span></a><span style="border-style:solid;border-width:0px;box-sizing:inherit;">.</span></p>'
      '#format': full_html
    were_any_of_your_convictions_prior_to_july_12_2021_and_for_one_o:
      '#type': webform_buttons
      '#title': 'Were any of your convictions prior to July 12, 2021 AND for one of the following marijuana-related crimes:'
      '#options':
        'Possessing, consuming or transporting two and one-half ounces or less of marijuana, of which not more than twelve and one-half grams was in the form of marijuana concentrate.': 'Possessing, consuming or transporting two and one-half ounces or less of marijuana, of which not more than twelve and one-half grams was in the form of marijuana concentrate.'
        "Possessing, transporting, cultivating or processing not more than six marijuana plants at the individual's primary residence for personal use.": "Possessing, transporting, cultivating or processing not more than six marijuana plants at the individual's primary residence for personal use."
        'Possessing, using or transporting paraphernalia relating to the cultivation, manufacture, processing or consumption of marijuana.': 'Possessing, using or transporting paraphernalia relating to the cultivation, manufacture, processing or consumption of marijuana.'
        'No, none of the above': 'No, none of the above'
      '#states':
        visible:
          ':input[name="is_this_your_first_felony_conviction_arizona"]':
            value: 'No'
          ':input[name="arizona_court_location"]':
            value: Arizona
      '#admin_title': 'ARIZONA Marijuana'
    arizona_expunge:
      '#type': processed_text
      '#states':
        visible:
          - ':input[name="were_any_of_your_convictions_prior_to_july_12_2021_and_for_one_o"]':
              value: 'Possessing, consuming or transporting two and one-half ounces or less of marijuana, of which not more than twelve and one-half grams was in the form of marijuana concentrate.'
          - or
          - ':input[name="were_any_of_your_convictions_prior_to_july_12_2021_and_for_one_o"]':
              value: "Possessing, transporting, cultivating or processing not more than six marijuana plants at the individual's primary residence for personal use."
          - or
          - ':input[name="were_any_of_your_convictions_prior_to_july_12_2021_and_for_one_o"]':
              value: 'Possessing, using or transporting paraphernalia relating to the cultivation, manufacture, processing or consumption of marijuana.'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Because you have more than one felony, your voting rights have not been automatically restored. But you are likely eligible for expungement of certain marijuana-related convictions, which may lead to automatic restoration of your voting rights.</p>

        <p>Under a new law passed in 2021, convictions for any of following Arizona crimes must be expunged by a court upon petition:</p>

        <p>1. Possessing, consuming or transporting two and one-half ounces or less of marijuana, of which not more than twelve and one-half grams was in the form of marijuana concentrate.</p>

        <p>2. Possessing, transporting, cultivating or processing not more than six marijuana plants at the individual's primary residence for personal use.</p>

        <p>3. Possessing, using or transporting paraphernalia relating to the cultivation, manufacture, processing or consumption of marijuana.</p>

        <p>If one or more of your convictions were for one of these Arizona state crimes, having the record(s) expunged can clear the path for restoration of your voting rights. Because the courts must grant expungement to an eligible person who applies, we recommend taking advantage of this process before pursuing restoring your voting rights in court. There is no cost to file the petition and certain organizations are providing free legal assistance.</p>

        <p>You can get help starting the process through the Arizona Justice Project.</p>

        <p><a href="https://azexpunge.org/expungement-eligibility-test/">Confirm your eligibility for expungement here</a>, then <a href="https://azexpunge.org/legal-clinics/">sign up to get help at a free legal clinic here</a> or use <a href="https://azjusticeprojectorg.app.law/reclaim-your-future-marijuana-expungement">their online tool to fill out the paperwork yourself</a>.</p>

        <p>If this process expunges all of your convictions, you are eligible to register and vote. If it expunges all but one of your convictions, you will be eligible to vote as long as you have completed your sentence, including probation and parole, and paid any restitution. We recommend returning to this website and answering the questions again without considering any expungable convictions to understand its effect.</p>
      '#format': basic_html
