        <p>North Dakota&nbsp;is the only state that does not require voter registration. In order to vote, simply go to&nbsp;<a href="https://vip.sos.nd.gov/WhereToVote.aspx?tab=AddressandVotingTimes">your polling place&nbsp;on Election Day</a>. You will need a form of&nbsp;<a href="https://vip.sos.nd.gov/idrequirements.aspx">photo identification</a>.</p>

