        <p>If you would like assistance looking up your record, please reach out to Restore Your Vote at&nbsp;(888) 306-8683 (toll-free) or <a href="mailto:restoreyourvote@campaignlegal.org">RestoreYourVote@CampaignLegal.org</a>.</p>
