        <p>Use this <a href="https://campaignlegal.org/sites/default/files/2019-01/Florida%20Clerks.pdf">list of County Clerks </a>to look up your status for free. You must search in each county where you may still be under supervised release.&nbsp;</p>

        <p>Or&nbsp;you can use this&nbsp;<a href="http://www.fdle.state.fl.us/Criminal-History-Records/Record-Check" target="_blank">database&nbsp;to look up your status</a>. This database is maintained by the State Department of Corrections so only one search is required.&nbsp;Each statewide records check <strong>costs $24</strong> and must be paid by debit or credit card.&nbsp;</p>

        <p>Finally, you can draft an advisory opinion request on your eligibility to vote by completing this&nbsp;<a href="https://restoreyourvote.formstack.com/forms/florida" rel="noopener noreferrer" target="_blank">form</a>. This will draft an advisory opinion request which you can send to the Florida Division of Elections.</p>

        <p>If you are still unsure of your status or have additional questions, please, <a href="mailto:restoreyourvote@campaignlegalcenter.org">reach out to Blair</a> and we will do our best to answer your individual question.&nbsp;</p>
      '#format': basic_html
  state_georgia:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: Georgia
    have_you_been_convicted_of_a_felony_ga:
      '#type': webform_buttons
      '#title': 'Have you been convicted of a felony?'
      '#help': 'Georgia&#39;s law disenfranchises people with convictions for a&nbsp;&quot;felony involving moral turpitude.&quot; Unfortunately, the Secretary of State has determined that&nbsp;all&nbsp;felonies involve moral turpitude. Therefore, anyone with a felony conviction&nbsp;must ensure that they have their voting rights restored.&nbsp;&nbsp;'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: Georgia
      '#admin_title': 'GEORGIA Felony '
    georgia_votes:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_ga"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!</strong>&nbsp;</p>

        <p>In&nbsp;Georgia, no one is disenfranchised for misdemeanors. If you are incarcerated but have not been convicted of any felony, you are still <strong>eligible to vote</strong>.&nbsp;</p>

        <p><a href="https://www.vote.org/register-to-vote/georgia/">Register to vote with our friends at Vote.org.&nbsp;</a></p>
      '#format': basic_html
    do_you_meet_any_of_the_following_exceptions_1_you_pled_nolo_cont:
      '#type': webform_buttons
      '#title': 'Do you meet ANY of the following exceptions?'
      '#help': 'These are special conditions that will not apply to most people.'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_ga"]':
            value: 'Yes'
      '#admin_title': 'GEORGIA exceptions'
    georgia_exceptions:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_ga"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - text-restrict-height
      '#text': |
        <p>1. You pled nolo contendere ("no contest"), even if you are still serving a sentence,</p>

        <p>or</p>

        <p>2. You were sentenced under the First Offender Act and your sentence has not been revoked,</p>

        <p>or</p>

        <p>3. You were sentenced under the Conditional Discharge statute and your sentence has not been revoked.</p>
      '#format': basic_html
    georgia_can_vote_exception:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="do_you_meet_any_of_the_following_exceptions_1_you_pled_nolo_cont"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#admin_title': '[georgia_can_vote_exception]'
      '#text': |
        <p><strong>You can vote!</strong></p>

        <p>Georgia law creates three exceptions to the rule that a felony temporarily takes away the right to vote. Your right to vote is not lost if one of the following is true for&nbsp;your felony conviction(s):</p>

        <p>• You pled nolo contendere (“no contest”), even if you are still serving a felony sentence.<br />
        (O.C.G.A. § 17-7-95);</p>

        <p>or</p>

        <p>• You were sentenced under the First Offender Act AND your sentence has not been revoked.<br />
        (O.C.G.A. § 42-8-60).</p>

        <p>or</p>

        <p>• You were sentenced under the Conditional Discharge statute AND your sentence has not been revoked. (O.C.G.A. § 16-13-2).</p>

        <p>If any of the above applies to your felony conviction(s), you remain eligible to vote, even while serving your sentence.</p>

        <p><a href="https://www.vote.org/register-to-vote/georgia/">Register to vote with our friends at Vote.org.&nbsp;</a></p>
      '#format': basic_html
    completed_your_sentence_including_parole_and_probation_ga:
      '#type': webform_buttons
      '#title': 'Have you completed your sentence including parole and probation?'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="do_you_meet_any_of_the_following_exceptions_1_you_pled_nolo_cont"]':
            value: 'No'
      '#admin_title': 'GEORGIA Parole'
    have_you_been_on_probation_for_more_than_three_years_:
      '#type': webform_buttons
      '#title': 'Have you been on probation for more than three years?'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
      '#states':
        visible:
          ':input[name="completed_your_sentence_including_parole_and_probation_ga"]':
            value: 'No'
      '#admin_title': 'GEORGIA early termination'
    georgia_early_termination:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_on_probation_for_more_than_three_years_"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>You are not eligible to vote yet, but <strong>you may be eligible for early termination of your probation, </strong>which would restore your voting rights.</p>

        <p>Under a law passed in 2021, you are eligible to be considered for early termination if you have (1) served at least three years on probation, (2) no new arrests; (3) no probation revocations in the past 24 months; and (4) paid all your restitution, if any was imposed (this does not include fines or fees).</p>

        <p>If you meet those criteria, you should ask your probation officer to&nbsp;submit an order to terminate your probation to the sentencing court. You do not need an attorney to start the early termination process.</p>

        <p>The judge will decide whether to terminate your probation. If your probation is terminated, you will still have to register to vote.</p>

        <p>For more information about early termination, visit the <a href="https://gjp.org/early-termination-of-probation/">Georgia Justice Project</a>.</p>
      '#format': basic_html
    georgia_cant_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_on_probation_for_more_than_three_years_"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote right now. Your right to vote will be restored when your sentence ends, including&nbsp;parole and probation and discharge of fines.</p>

        <p>If you are serving probation, you may become eligible for early termination of your sentence after three years. <a href="https://gjp.org/early-termination-of-probation/">Visit Georgia Justice Project for more information.</a></p>
      '#format': basic_html
    have_you_paid_all_fines_or_fees_connected_to_your_conviction_ga:
      '#type': webform_buttons
      '#title': 'Do you owe any fines on your felony conviction? (Not all legal debts are fines; restitution, court costs, and probation fees do not impact the right to vote. Fines which are imposed as a condition of probation are cancelled upon completion of probation.)'
      '#help': 'Under Georgia law, only outstanding fines impact the right to vote. If you owe restitution, costs, surcharges, or fees but not fines, or if your fines were cancelled (for example, fines imposed as a condition of probation are cancelled upon completion of probation), select &quot;No.&quot;'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
        "I'm not sure": "I'm not sure"
      '#states':
        visible:
          ':input[name="completed_your_sentence_including_parole_and_probation_ga"]':
            value: 'Yes'
      '#admin_title': 'GEORGIA Fines'
    georgia_votes_postconviction:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_paid_all_fines_or_fees_connected_to_your_conviction_ga"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You&nbsp;can vote!</strong>&nbsp;</p>

        <p>In&nbsp;Georgia, the&nbsp;right to vote is automatically restored upon completion of your felony sentence, including payment or discharge of statutory fines.</p>

        <p><a href="https://www.vote.org/register-to-vote/georgia/">Register to vote with our friends at Vote.org.&nbsp;</a></p>
      '#format': basic_html
    georgia_fines_maybe:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_paid_all_fines_or_fees_connected_to_your_conviction_ga"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>You are <strong>not</strong> eligible to vote at this time.</p>

        <p>Under Georgia law, a person convicted of a felony who does not meet one of the above exceptions cannot register to vote until they have completed their sentence and discharged any fines. It is important to note that not all legal debt is a fine&nbsp;and that some fines which were imposed as a condition of probation are automatically cancelled upon completion of probation. That means that most people who have finished probation no longer owe fines.</p>

        <p>For assistance looking into your possible fines, please contact us at&nbsp;<a href="mailto:restoreyourvote@campaignlegalcenter.org">restoreyourvote@campaignlegalcenter.org</a>.</p>
      '#format': basic_html
    georgia_fines_unsure:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_paid_all_fines_or_fees_connected_to_your_conviction_ga"]':
            value: "I'm not sure"
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>If you are not sure if you owe fines, you can request a Certificate of Completion of your sentence from the <a href="https://dcs.georgia.gov/locations/field-office">Department of Community Supervision</a>.</p>

        <p>If you are unable to obtain that document or have other questions, please contact us at <a href="restoreyourvote@campaignlegal.org">restoreyourvote@campaignlegal.org</a>.</p>
      '#format': basic_html
