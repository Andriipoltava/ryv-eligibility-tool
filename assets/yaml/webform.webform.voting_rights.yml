      '#text': '<p lang="EN-US"><strong>You are eligible to petition for restoration of your voting rights.</strong> As of May 2, 2025, the only way to restore voting rights in Tennessee is to petition the circuit county of the county where you were convicted or where you reside.</p><p lang="EN-US"><a href="https://restoreyourvote.formstack.com/forms/tnpetition">To begin that process without a lawyer, click here.</a></p><p lang="EN-US">To be eligible to petition for voting rights restoration, you must have completed your sentence, including probation and parole, and paid all victim restitution. Petitioners must also be current on the payment of any child support obligations or, if they owe arrears, been compliant with payments for one year.</p>'
      '#format': basic_html
  state_new_york:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: NY
    ny_2021:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: NY
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>As of May 4, 2021, New York has changed its law to restore voting rights to all people who are not currently incarcerated for a felony conviction. </strong>That means that tens of thousands of New Yorkers serving parole and probation are guaranteed the right to vote.</p>

        <p>To learn how the new law applies to you, answer the questions below. To read the new law, <a href="https://legislation.nysenate.gov/pdf/bills/2021/S830B">click here</a>.</p>

        <p>If you have any questions, please reach out to us at <a href="email:restoreyourvote@campaignlegal.org">RestoreYourVote@CampaignLegal.org</a> or call 888-306-8683.</p>
      '#format': basic_html
    have_you_been_convicted_of_a_felony_ny:
      '#type': webform_buttons
      '#title': 'Have you been convicted of a felony? '
      '#options': yes_no
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: NY
      '#admin_title': 'NEW YORK Convicted'
    ny_votes:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_ny"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!</strong>&nbsp;&nbsp;</p>

        <p>In&nbsp;New York, no one loses the right to vote for misdemeanors or any other convictions than felonies. If you are incarcerated but have not been convicted of any felony, you are still <strong>eligible to vote</strong>.&nbsp;</p>

        <p><a href="https://www.vote.org/register-to-vote/new-york/">Register to vote with our friends at Vote.org.</a></p>
      '#format': basic_html
    are_you_currently_incarcerated_for_a_felony_conviction_ny:
      '#type': webform_buttons
      '#title': 'Are you currently incarcerated for a felony conviction?'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_ny"]':
            value: 'Yes'
      '#admin_title': 'NEW YORK Incarcerated'
    ny_no_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="are_you_currently_incarcerated_for_a_felony_conviction_ny"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote yet. In&nbsp;New York,&nbsp;your right to vote is taken away while you are incarcerated&nbsp;for a felony conviction. After&nbsp;completion&nbsp;of your prison sentence, your right to vote will be immediately restored, even if you are still on probation or parole.</p>
      '#format': basic_html
    ny_rights_restored:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="are_you_currently_incarcerated_for_a_felony_conviction_ny"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p lang="EN-US"><strong>You can vote!</strong></p>

        <p lang="EN-US">As of May 4, 2021, all New Yorkers convicted of felonies have the right to vote as long as they are not currently incarcerated for a felony conviction. That means that you can vote in New York even if you are serving probation or parole.</p>

        <p lang="EN-US">Click <a href="https://dmv.ny.gov/more-info/electronic-voter-registration-application">here to register to vote.</a></p>
      '#format': basic_html
