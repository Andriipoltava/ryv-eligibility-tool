id: voting_rights
title: 'Voting Rights'
description: ''
categories: {  }
elements: |-
  in_what_state_were_you_convicted_of_a_felony_:
    '#type': select
    '#title': 'In what state do you want to register to vote? '
    '#options':
      Alabama: Alabama
      Alaska: Alaska
      Arizona: Arizona
      Arkansas: Arkansas
      California: California
      Colorado: Colorado
      Connecticut: Connecticut
      Delaware: Delaware
      DC: 'District of Columbia'
      Florida: Florida
      Georgia: Georgia
      Hawaii: Hawaii
      Idaho: Idaho
      Illinois: Illinois
      Indiana: Indiana
      Iowa: Iowa
      Kansas: Kansas
      Kentucky: Kentucky
      Louisiana: Louisiana
      Maine: Maine
      Maryland: Maryland
      Massachusetts: Massachusetts
      Michigan: Michigan
      Minnesota: Minnesota
      Mississippi: Mississippi
      Missouri: Missouri
      Montana: Montana
      Nebraska: Nebraska
      Nevada: Nevada
      NH: 'New Hampshire'
      NJ: 'New Jersey'
      NM: 'New Mexico'
      NY: 'New York'
      NC: 'North Carolina'
      ND: 'North Dakota'
      Ohio: Ohio
      Oklahoma: Oklahoma
      Oregon: Oregon
      Pennsylvania: Pennsylvania
      PR: 'Puerto Rico'
      RI: 'Rhode Island'
      SC: 'South Carolina'
      SD: 'South Dakota'
      Tennessee: Tennessee
      Texas: Texas
      Utah: Utah
      Vermont: Vermont
      VA: Virginia
      Washington: Washington
      WV: 'West Virginia'
      Wisconsin: Wisconsin
      Wyoming: Wyoming
    '#empty_option': 'Select a state'
    '#select2': true
  state_alabama:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: Alabama
    alabama_splc_project:
      '#type': processed_text
      '#states':
        visible-slide:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: Alabama
        invisible-slide:
          - ':input[name="al_felony_conviction"]':
              value: 'Yes'
          - or
          - ':input[name="al_felony_conviction"]':
              value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Campaign Legal Center is working to fight felony disenfranchisement in Alabama. <a href="https://campaignlegal.org/cases-actions/felony-voting-rights-restoration-alabama">Learn more about our work here</a>.</p>
      '#format': basic_html
    al_felony_conviction:
      '#type': webform_buttons
      '#title': 'Have you been convicted of a felony?'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
        Maybe: "I don't know"
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: Alabama
      '#admin_title': 'ALABAMA Felony Conviction '
    alabama_database_search:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_felony_conviction"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>If you need help looking up your record please, call 202-857-0314 or <a href="mailto:restoreyourvote@campaignlegalcenter.org">email us</a>.</p>
      '#format': basic_html
    al_votes:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_felony_conviction"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!</strong>&nbsp; In Alabama, no one loses the right to vote for misdemeanors or any other convictions than felonies. If you are incarcerated but have not been convicted of any felony, you are still eligible to vote.</p>

        <p><a href="https://www.vote.org/register-to-vote/alabama/">Register to vote with&nbsp;our friends at Vote.org</a>.</p>
      '#format': basic_html
    al_moral_turpitude_felonies:
      '#type': webform_buttons
      '#title': 'Have you been convicted of one or more of the following felonies? Please scroll to see the complete list. (Note: if you were convicted of an attempt, conspiracy to commit, or solicitation of any of the below convictions, select "Yes".)'
      '#help': '<p>Please pay attention to the degree of your conviction as it can change your eligibility to vote.&nbsp;</p>'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
        Maybe: "I Don't Know"
        FOS: 'I was convicted in federal court or outside of Alabama.'
      '#states':
        visible:
          ':input[name="al_felony_conviction"]':
            value: 'Yes'
      '#admin_title': 'ALABAMA Moral Turpitude '
    al_mt_list:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_felony_conviction"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - text-restrict-height
      '#admin_title': 'ALABAMA MT List'
      '#text': '<ul><li>Aggravated child abuse</li><li>Aggravated theft by deception</li><li>Aggravated stalking</li><li>Assault (1st or 2nd degree)</li><li>Attempt to commit an explosives or destructive device or bacteriological or biological weapons crime</li><li>Bigamy</li><li>Burglary (1st or 2nd degree)</li><li>Compelling street gang membership</li><li>Conspiracy to commit an explosives or destructive device or bacteriological or biological weapons crime</li><li>Dissemination or public display of obscene matter containing visual depiction of persons under 17 years of age involved in obscene acts</li><li>Distribution, possession with intent to distribute, production of, or offer or agreement to distribute or produce obscene material</li><li>Domestic violence (1st or 2nd degree)&nbsp;</li><li>Domestic violence by strangulation or suffocation</li><li>Elder abuse</li><li>Electronic solicitation of a child</li><li>Endangering the water supply</li><li>Enticing a child to enter a vehicle for immoral purposes</li><li>Facilitating solicitation of unlawful sexual conduct with a child</li><li>Facilitating the online solicitation of a child</li><li>Facilitating the travel of a child for an unlawful sex act</li><li>Felonies committed against election officials</li><li>Forgery (1st or 2nd degree)</li><li>Hindrance or obstruction during detection, disarming, or destruction of a destructive device or weapon</li><li>Hindering prosecution of terrorism</li><li>Human trafficking (1st or 2nd degree)</li><li>Incest</li><li>Kidnapping (1st or 2nd degree)</li><li>Manslaughter</li><li>Murder (including capital, noncapital, reckless, and felony murder)</li><li>Parents or guardians permitting children to engage in production of obscene matter</li><li>Possession or possession with intent to disseminate of obscene matter containing visual depiction of persons under 17 years of age involved in obscene acts</li><li>Possession, manufacture, transport, or distribution of a destructive device or bacteriological or biological weapon</li><li>Possession, manufacture, transport, or distribution of a detonator, explosive, poison, or hoax device</li><li>Possession or distribution of a hoax device represented as a destructive device or weapon</li><li>Production of obscene matter containing visual depiction of persons under 17 years of age involved in obscene acts</li><li>Production or distribution of a destructive device or weapon intended to cause injury or destruction</li><li>Prohibited acts in the offer, sale, or purchase of securities</li><li>Rape (1st or 2nd degree)</li><li>Robbery (1st, 2nd, or 3rd degree)</li><li>Selling, furnishing, giving away, delivering, or distribution of a destructive device, a bacteriological weapon, or biological weapon to a person who is less than 21 years of age</li><li>Sexual abuse (1st or 2nd degree)</li><li>Sexual abuse of a child under 12 years old</li><li>Sexual torture</li><li>Sodomy (1st or 2nd degree)</li><li>Soliciting or providing support for an act of terrorism</li><li>Terrorism</li><li>Theft of lost property (1st or 2nd degree)</li><li>Theft of property (1st or 2nd degree)</li><li>Theft of trademarks or trade secrets</li><li>Torture or other willful maltreatment of a child under the age of 18 (Child Abuse)</li><li>Trafficking in cannabis, cocaine, or other illegal drugs or trafficking in amphetamine or methamphetamine</li><li>Traveling to meet a child for an unlawful sex act</li><li>Treason</li></ul>'
      '#format': basic_html
    al_no_cerv_list:
      '#type': webform_buttons
      '#title': 'Have you been convicted of one or more of the following felonies? (Note: Please scroll to see the complete list)'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
        Maybe: "I Don't Know"
      '#states':
        visible:
          ':input[name="al_moral_turpitude_felonies"]':
            value: 'Yes'
      '#admin_title': 'ALABAMA No CERV List'
    no_cerv_felonies:
      '#type': processed_text
      '#states':
        visible-slide:
          ':input[name="al_moral_turpitude_felonies"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - text-restrict-height
      '#text': |
        <ul>
        	<li>Impeachment</li>
        	<li>Murder</li>
        	<li>Rape</li>
        	<li>Sodomy</li>
        	<li>Sexual Abuse</li>
        	<li>Sexual Crimes Against Children</li>
        	<li>Treason</li>
        </ul>
      '#format': basic_html
    al_no_cerv_database:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_no_cerv_list"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>If you need help looking up your record please, call 202-857-0314 or <a href="mailto:restoreyourvote@campaignlegalcenter.org">email us</a>.</p>
      '#format': basic_html
    al_no_cerv_need_pardon:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_no_cerv_list"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>You may be able to restore your right to vote by seeking a pardon from the Board of Pardons and Paroles.</p>

        <p>To request a pardon, <a href="https://paroles.alabama.gov/wp-content/uploads/ABPP-3-Pardon-Application.pdf">you can complete this form and submit it to the Alabama Board of Pardons and Paroles.</a></p>
      '#format': basic_html
    mt_database:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_moral_turpitude_felonies"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>If you need help looking up your record please, call 202-857-0314 or <a href="mailto:restoreyourvote@campaignlegalcenter.org">email us</a>.</p>
      '#format': basic_html
    alabama_probation_parole:
      '#type': webform_buttons
      '#title': 'Have you completed your sentence including probation and or parole? '
      '#options': yes_no
      '#states':
        visible:
          ':input[name="al_no_cerv_list"]':
            value: 'No'
      '#admin_title': 'ALABAMA Probation/Parole'
    al_votes_not_mt:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_moral_turpitude_felonies"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You have the right to vote!</strong></p>

        <p>Even if you have not completed your sentence, have outstanding fines or fees, or have been wrongly told you cannot vote, you never lost your voting rights.</p>

        <p>Register to vote online by <a href="https://www.alabamainteractive.org/sos/voter_registration/voterRegistrationWelcome.action">visiting the Secretary of State’s website</a>.</p>

        <p>Or you can <a href="https://www.sos.alabama.gov/sites/default/files/voter-pdfs/nvra-2.pdf">fill out this form</a> and mail it your County Board of Registrars (addresses for which are on the form).</p>

        <p>If you have questions or would like to share your story, please, <a href="mailto:restoreyourvote@campaignlegalcenter.org">email us.</a></p>
      '#format': basic_html
    al_no_vote_probation:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="alabama_probation_parole"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately you are not yet eligible to restore your voting rights. You will be eligible once you complete your sentence and pay all fines, fees and restitution that you owe.</p>

        <p>If you have questions, please, <a href="mailto:restoreyourvote@campaignlegalcenter.org">email us.</a></p>
      '#format': basic_html
    al_fines_fees:
      '#type': webform_buttons
      '#title': 'Do you owe any outstanding fines, fees, or restitution from your conviction of one of the above felonies? '
      '#help': '<em><span style="font-size:12.0pt"><span style="line-height:107%"><span style="font-family:&quot;Century Schoolbook&quot;,serif">If you owe money from a misdemeanor or a different felony, answer no </span></span></span></em>'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
        Maybe: "I Don't Know"
      '#states':
        visible:
          ':input[name="alabama_probation_parole"]':
            value: 'Yes'
      '#admin_title': 'ALABAMA LFOs'
    al_no_vote_lfos:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_fines_fees"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you are currently ineligible to restore your voting rights. You are ineligible to restore your right to vote until you have paid off your fines, fees, and restitution or the Board of Pardons and Paroles has forgiven them.</p>

        <p>You can request a reduction or forgiveness of your fines&nbsp;by <a href="https://paroles.alabama.gov/wp-content/uploads/ABPP-5-Remission-of-Fine-and-or-Forfeiture-Application.pdf">filling out this form and submitting it to the Alabama Board of Pardons and Paroles.&nbsp; &nbsp;</a> &nbsp; &nbsp; &nbsp;</p>

        <p>If you have questions, please, call (202-857-0314) or&nbsp;<a href="mailto:restoreyourvote@campaignlegalcenter.org">email us.</a></p>
      '#format': basic_html
    al_pending_felony:
      '#type': webform_buttons
      '#title': 'Do you have any pending felony charges? '
      '#help': '<em><span style="font-size:12.0pt"><span style="line-height:107%"><span style="font-family:&quot;Century Schoolbook&quot;,serif">If the charge is only for traffic or a misdemeanor, you should answer no to this question</span></span></span></em>'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="al_fines_fees"]':
            value: 'No'
      '#admin_title': 'ALABAMA Pending Charges'
    al_pending_charge_no_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_pending_felony"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you are currently ineligible to apply to restore your voting rights</p>

        <p>Once your felony charge has been resolved, you can apply to restore your voting rights.</p>

        <p>If you have questions, please, <a href="mailto:restoreyourvote@campaignlegalcenter.org">email us.</a></p>
      '#format': basic_html
    al_cerv:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_pending_felony"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': '<p>You are eligible to restore your voting rights. If you complete&nbsp;a <a href="https://paroles.alabama.gov/wp-content/uploads/ABPP-4-CERV-Application-Form-Fillable-1.pdf">request for a&nbsp;Certificate of Eligibility to Register to Vote&nbsp;(CERV)</a> and submit&nbsp;it to the Alabama Board of Pardons and Paroles, the state must restore your right to vote. The state&nbsp;should respond to your request within 44 days.</p><p>If you have questions, need help completing the CERV, or do not hear back within 44 days please, call us at (202) 857-0314&nbsp;or&nbsp;<a href="mailto:restoreyourvote@campaignlegalcenter.org">email us.</a></p><p>&nbsp;</p>'
      '#format': basic_html
    al_lfos_database:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_fines_fees"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>If you need help looking up your record please, call 202-857-0314 or <a href="mailto:restoreyourvote@campaignlegalcenter.org">email us</a>.</p>
      '#format': basic_html
    federal_outofstate_contact:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_moral_turpitude_felonies"]':
            value: FOS
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><span><span>Under Alabama law, convictions in other states or in federal court only take away the right to vote if they would constitute one of above offenses had they been convictions in Alabama state court. <a href="mailto:bbowie@campaignlegalcenter.org">Contact Blair</a> at <a href="mailto:bbowie@Campaignlegal.org">bbowie@Campaignlegal.org</a> to find out whether your out of state or federal offense is disqualifying in Alabama.</span></span></p>
      '#format': basic_html
  state_nevada:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: Nevada
    have_you_been_convicted_of_a_felony_nv:
      '#type': webform_buttons
      '#title': 'Have you been convicted of a felony?'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
      '#states':
        visible:
          - ':input[name="were_you_convicted_in_an_nevada_state_court_a_federal_court_a_s"]':
              value: Combo
          - or
          - ':input[name="were_you_convicted_in_an_nevada_state_court_a_federal_court_a_s"]':
              value: Nevada
          - or
          - ':input[name="were_you_convicted_in_an_nevada_state_court_a_federal_court_a_s"]':
              value: Federal
      '#admin_title': 'NEVADA FELONY'
    nv_are_you_currently_incarcerated:
      '#type': webform_buttons
      '#title': "Are you currently incarcerated?\_"
      '#options': yes_no
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_nv"]':
            value: 'Yes'
      '#admin_title': 'NEVADA Incarceration'
    nv_votes:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_nv"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!</strong>&nbsp;</p>

        <p>In&nbsp;Nevada, no one is disenfranchised for misdemeanors, even while incarcerated.</p>

        <p>If you are incarcerated but have not been convicted of a felony, you are still<strong> eligible to vote</strong>. That’s true even if you have been charged with a felony.&nbsp;</p>

        <p><a href="https://www.vote.org/register-to-vote/nevada/">Register to vote with our friends at vote.org.</a></p>

        <p>If you’d like more support&nbsp;(or would like to share your story of registering to vote!),&nbsp;please contact <a href="mailto:restoreyourvote@campaignlegalcenter.org">Blair</a>.</p>
      '#format': basic_html
    nv_no_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="nv_are_you_currently_incarcerated"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote yet. In&nbsp;Nevada,&nbsp;you cannot restore your right to vote&nbsp;until you are released from incarceration.&nbsp;</p>

        <p>If you’d like more support,&nbsp;please contact <a href="mailto:restoreyourvote@campaignlegalcenter.org">Blair</a>.&nbsp;</p>
      '#format': basic_html
    nv_votes_post_incarceration:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="nv_are_you_currently_incarcerated"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!</strong>&nbsp;</p>

        <p>In Nevada, people with felony convictions <strong>can vote</strong> after they are released from incarceration. That’s true even if you are on probation or parole.</p>

        <p><a href="https://www.vote.org/register-to-vote/nevada/">Register to vote with our friends at vote.org.</a></p>
      '#format': basic_html
  state_maine:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: Maine
    processed_text_24:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: Maine
      '#wrapper_attributes':
        class:
          - message--path-end
      '#admin_title': 'Help text: Maine'
      '#text': |
        <p><strong>You can vote!</strong>&nbsp;In&nbsp;Maine, there are&nbsp;no&nbsp;restrictions on eligibility to vote based on criminal convictions.&nbsp;</p>

        <p><a href="https://www.vote.org/register-to-vote/maine/">Register to vote with our friends at Vote.org.&nbsp;</a></p>

        <p>For more information about voting in&nbsp;Maine, visit the <a href="https://www.maine.gov/sos/cec/elec/voter-info/voterguide.html">Secretary of State's website</a>.&nbsp;&nbsp;&nbsp;</p>
      '#format': basic_html
  state_california:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: California
    california_convicted_of_a_felony:
      '#type': webform_buttons
      '#title': 'Have you been convicted of a felony?'
      '#help': 'Not including any juvenile adjudications'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: California
      '#admin_title': 'CALIFORNIA Have you been convicted of a felony'
    california_you_can_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="california_convicted_of_a_felony"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!</strong>&nbsp;</p>

        <p>In&nbsp;California, no one is disenfranchised for misdemeanors or any other convictions than felonies.&nbsp;Juvenile adjudications never affect your right to vote.&nbsp;If you are incarcerated but have not been convicted of a felony, you are still eligible to vote. That’s true even if you&nbsp;have been charged with a felony.</p>

        <p><a href="https://www.vote.org/register-to-vote/california/">Register to vote with out friends at Vote.org.</a></p>
      '#format': basic_html
    california_currently_incarcerated_for_your_felony_conviction_:
      '#type': webform_buttons
      '#title': "Are you currently incarcerated for your felony conviction?\_"
      '#options': yes_no
      '#states':
        visible:
          ':input[name="california_convicted_of_a_felony"]':
            value: 'Yes'
      '#admin_title': 'CALIFORNIA Are you currently incarcerated'
    california_incarcerated_in_a_county_jail:
      '#type': webform_buttons
      '#title': 'Are you currently incarcerated in a county jail?'
      '#help': 'as opposed to a state or federal prison'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="california_currently_incarcerated_for_your_felony_conviction_"]':
            value: 'Yes'
      '#admin_title': 'CALIFORNIA Are you in a county jail'
    california_currently_serving_a_state_prison_sentence:
      '#type': webform_buttons
      '#title': 'Are you currently serving a state prison sentence even though you are in county jail'
      '#help': 'as opposed to a felony jail sentence or jail time as a condition of probation'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
        Maybe: "I Don't Know "
      '#states':
        visible:
          ':input[name="california_incarcerated_in_a_county_jail"]':
            value: 'Yes'
      '#admin_title': 'CALIFORNIA Are you in a county jail for state offense'
    california_cant_vote:
      '#type': processed_text
      '#states':
        visible:
          - ':input[name="california_incarcerated_in_a_county_jail"]':
              value: 'No'
          - or
          - ':input[name="california_currently_serving_a_state_prison_sentence"]':
              value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote right now. Your right to vote will be restored&nbsp;after your release from incarceration for a felony conviction.</p>
      '#format': basic_html
    ask_for_help:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="california_currently_serving_a_state_prison_sentence"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>If you are unsure of what type of sentence you are serving&nbsp;while in county jail, ask your probation officer, parole officer, or staff&nbsp;at your correctional facility.</p>
      '#format': basic_html
    california_you_can_vote_county:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="california_currently_serving_a_state_prison_sentence"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote</strong>&nbsp;even while in county jail!</p>

        <p>&nbsp;When you register to vote, you can&nbsp;apply&nbsp;to vote by mail.</p>

        <p><a href="https://www.vote.org/register-to-vote/california/">Register to vote with our friends at vote.org.</a></p>
      '#format': basic_html
    california_you_can_vote_postparole:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="california_currently_incarcerated_for_your_felony_conviction_"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!</strong>&nbsp;That’s true even if you are on parole, probation, mandatory supervision, post-release community release, or federal supervised release.&nbsp;&nbsp;</p>

        <p><a href="https://www.vote.org/register-to-vote/california/">Register to vote with our friends at Vote.org.&nbsp;</a></p>
      '#format': basic_html
  state_alaska:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: Alaska
    alaska_have_you_been_convicted_of_a_felony:
      '#type': webform_buttons
      '#title': 'Have you been convicted of a felony?'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: Alaska
      '#admin_title': 'ALASKA Have you been convicted of a felony? '
    alaska_you_can_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="alaska_have_you_been_convicted_of_a_felony"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!&nbsp;</strong></p>

        <p>In&nbsp;Alaska, no one is disenfranchised for misdemeanors or any convictions other than felonies. If you are incarcerated but have not been&nbsp;convicted&nbsp;of a felony, you are still eligible to vote. That’s true even if you are charged with a felony.&nbsp;</p>

        <p><a href="https://www.vote.org/register-to-vote/alaska/">Register to vote with our friends at vote.org.</a>&nbsp;&nbsp;</p>
      '#format': basic_html
    alaska_convicted_of_one_of_the_following_felonies:
      '#type': webform_buttons
      '#title': 'Have you been convicted of one of the following felonies?'
      '#help': '<p><a href="http://www.elections.alaska.gov/wp-content/uploads/2024/07/20240717_List-of-Felonies-Involving-Moral-Turpitude.pdf" target="_blank">The list is also available here.</a></p><p>If you were convicted of an attempt, conspiracy, or solicitation for one of the below crimes, select "Yes."</p>'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
        Maybe: "I Don't Know "
      '#states':
        visible:
          ':input[name="alaska_have_you_been_convicted_of_a_felony"]':
            value: 'Yes'
      '#admin_title': 'ALASKA Felony List'
    alaska_database:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="alaska_convicted_of_one_of_the_following_felonies"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><a href="https://records.courts.alaska.gov/eaccess/home.page.2">Use this database&nbsp;to lookup your conviction.&nbsp;</a></p>
      '#format': basic_html
    alaska_you_can_vote_convicted:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="alaska_convicted_of_one_of_the_following_felonies"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>You can vote!&nbsp;</p>

        <p>Alaska&nbsp;disenfranchises people with convictions for felonies "involving moral turpitude." Although the phrase "moral turpitude" is unclear, the Department of Corrections has adopted a definition of "moral turpitude." Since your felony conviction is not on the Department of Corrections list, you are eligible to vote, even if you are incarcerated or on parole or probation.&nbsp;</p>

        <p><a href="https://www.vote.org/register-to-vote/alaska/">Register to vote with our friends at vote.org.</a></p>
      '#format': basic_html
