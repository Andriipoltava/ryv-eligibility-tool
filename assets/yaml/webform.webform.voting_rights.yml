      '#text': '<p>There have been significant changes to the voting rights restoration process in Tennessee. As of May 2025, the only way to restore voting rights in Tennessee is to petition the circuit county of the county where you were convicted or where you reside.</p><p>Additionally, as of March 26, 2026, unpaid court costs are no longer a barrier to voting rights restoration. Also, a person may be eligible for restoration if they owe outstanding child support, so long as they have been compliant with payment orders for one year.</p><p lang="EN-US">To be eligible to petition for voting rights restoration, you must have completed your sentence, including probation and parole and paid all victim restitution. Petitioners must also be current on the payment of any child support obligations or compliant with any payment orders for one year. You cannot have been convicted of certain crimes during particular time periods.</p><p>Answer the below questions to determine if you are eligible to petition and to receive instructions on how to start the process.</p><p>For additional assistance contact us at (202) 857-0314 or (888) 306-8683 (toll-free) or by email: <a href="mailto:restoreyourvote@campaignlegal.org">RestoreYourVote@campaignlegal.org</a></p>'
