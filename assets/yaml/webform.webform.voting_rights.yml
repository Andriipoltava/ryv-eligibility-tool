      '#markup': 'Your right to vote has not been restored by Governor Beshear&#39;s Executive Order. The order does not apply to people with federal or out of state convictions. You may still apply to the Governor for rights restoration by petition. <a href="https://civilrightsrestoration.ky.gov/Pages/application.aspx">To learn more about the petition process, click here</a>.'
