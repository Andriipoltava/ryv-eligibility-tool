          - text-restrict-height
      '#text': |
        <p>Murder&nbsp;</p>

        <p>Manslaughter</p>

        <p>Kidnapping</p>

        <p>Sexual assault in the first or second degree</p>

        <p>Robbery</p>

        <p>Aggravated assault</p>

        <p>Strangulation of a household member</p>

        <p>Aircraft hijacking</p>

        <p>Arson in the first or second degree</p>

        <p>Aggravated burglary</p>

        <p>Sexual abuse of a minor in the first or second degree if an actor sixteen (16) years or older committed sexual intrusion on a victim less than thirteen (13) years of age&nbsp;</p>
      '#format': basic_html
    wyoming_no_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="were_you_convicted_of_one_of_the_following_violent_felonies_wy"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote. In&nbsp;Wyoming, people convicted of these specified violent felonies are not eligible to vote absent a restoration of their rights from the Governor. To apply for restoration of rights or a pardon from the Governor, contact the&nbsp;Wyoming&nbsp;Attorney General’s office at&nbsp;307-777-7841 to request an application.&nbsp;</p>
      '#format': basic_html
    have_you_been_convicted_of_more_than_one_felony_wy:
      '#type': webform_buttons
      '#title': 'Have you been convicted of more than one felony?'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="were_you_convicted_of_one_of_the_following_violent_felonies_wy"]':
            value: 'No'
      '#admin_title': 'WYOMING Multiple'
    are_all_of_your_felonies_related_to_the_same_occurrence_wy:
      '#type': webform_buttons
      '#title': 'Are all of your felonies related to the same occurrence or series of events?'
      '#help': 'If all incidents happened&nbsp;at the same time then answer yes'
      '#options': yes_no
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_more_than_one_felony_wy"]':
            value: 'Yes'
      '#admin_title': 'WYOMING Same Event'
    wyoming_no_vote_multiple:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="are_all_of_your_felonies_related_to_the_same_occurrence_wy"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote. In&nbsp;Wyoming, people convicted of multiple felonies not arising out of the same event&nbsp;are not eligible to vote absent a restoration of their rights from the Governor. To apply for restoration of rights or a pardon from the Governor, contact the&nbsp;Wyoming&nbsp;Attorney General’s office at&nbsp;307-777-7841 to request an application.&nbsp;</p>
      '#format': basic_html
    wy_completed_your_sentence_including_parole_and_or_probati:
      '#type': webform_buttons
      '#title': 'Have you completed your sentence, including parole and/or probation?'
      '#options': yes_no
      '#states':
        visible:
          - ':input[name="are_all_of_your_felonies_related_to_the_same_occurrence_wy"]':
              value: 'Yes'
          - or
          - ':input[name="have_you_been_convicted_of_more_than_one_felony_wy"]':
              value: 'No'
      '#admin_title': 'WYOMING Parole'
    wyoming_no_vote_parole:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="wy_completed_your_sentence_including_parole_and_or_probati"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>&nbsp;Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote yet. In&nbsp;Wyoming, you&nbsp;are not eligible to restore your voting rights until you complete&nbsp;your&nbsp;sentence, including&nbsp;parole and/or probation. Check back here after you have completed your sentence to understand your voting rights.&nbsp;</p>
      '#format': basic_html
    was_your_conviction_s_in_wyoming_state_court_federal_court_or_in:
      '#type': webform_buttons
      '#title': 'Was your conviction(s) in Wyoming state court, federal court, or in a state court outside Wyoming?'
      '#options':
        Wyoming: 'Wyoming State Court'
        Federal: 'Federal Court'
        Other: 'State Court Outside Wyoming'
      '#states':
        visible:
          ':input[name="wy_completed_your_sentence_including_parole_and_or_probati"]':
            value: 'Yes'
      '#admin_title': 'WYOMING Court Location'
    wyoming_vote_out_of_state:
      '#type': processed_text
      '#states':
        visible:
          - ':input[name="was_your_conviction_s_in_wyoming_state_court_federal_court_or_in"]':
              value: Federal
          - or
          - ':input[name="was_your_conviction_s_in_wyoming_state_court_federal_court_or_in"]':
              value: Other
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You are eligible to have your voting rights restored!</strong>&nbsp;Upon application, the Department of Corrections&nbsp;must&nbsp;issue a certificate restoring your voting rights.&nbsp;&nbsp;</p>

        <p lang="EN-US">In order to&nbsp;apply, you will need a copy of your judgment and sentence for your conviction(s) and documentation that you have completed your sentence. Once you have collected those documents, you should <a href="https://docs.google.com/a/wyo.gov/viewer?a=v&amp;pid=sites&amp;srcid=d3lvLmdvdnxkb2N8Z3g6N2JkZDlhOTU0NTU0OTg5ZA">submit this application</a>,&nbsp;to the Wyoming Department of Corrections:&nbsp;&nbsp;</p>

        <p lang="EN-US">Wyoming Department of Corrections&nbsp;<br />
        Attn: Field Services Administrator&nbsp;<br />
        1934&nbsp;Wyott&nbsp;Drive, Suite 100&nbsp;<br />
        Cheyenne, WY 82002&nbsp;</p>

        <p lang="EN-US">The review of your application should be complete within 30 days.&nbsp;</p>

        <p lang="EN-US">More information is&nbsp;available&nbsp;<a href="https://sites.google.com/a/wyo.gov/doc/home/restoration-of-voting-rights">here</a>.&nbsp;</p>
      '#format': basic_html
    did_you_complete_your_sentence_before_or_after_january_1_2010_wy:
      '#type': webform_buttons
      '#title': 'Did you complete your sentence before or after January 1, 2010?'
      '#options':
        Old: 'Before January 1, 2010'
        New: 'After January 1, 2010'
      '#states':
        visible:
          ':input[name="was_your_conviction_s_in_wyoming_state_court_federal_court_or_in"]':
            value: Wyoming
      '#admin_title': 'WYOMING Date'
    wyoming_vote_restore:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="did_you_complete_your_sentence_before_or_after_january_1_2010_wy"]':
            value: Old
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p lang="EN-US"><strong>You are eligible to have your&nbsp;voting&nbsp;rights restored!&nbsp;</strong>Upon application, the Department of Corrections&nbsp;must&nbsp;issue a certificate restoring your voting rights.&nbsp;&nbsp;</p>

        <p lang="EN-US">In order to&nbsp;apply, you will need a copy of your judgment and sentence for your conviction(s) and documentation that you have completed your sentence. Once you have collected those documents, you should <a href="https://docs.google.com/a/wyo.gov/viewer?a=v&amp;pid=sites&amp;srcid=d3lvLmdvdnxkb2N8Z3g6MTlkMjQxOTI3ZWEyZDA4OA">submit this application</a>, to the Wyoming Department of Corrections:&nbsp;&nbsp;</p>

        <p lang="EN-US">Wyoming Department of Corrections&nbsp;</p>

        <p lang="EN-US">Attn: Field Services Administrator&nbsp;</p>

        <p lang="EN-US">1934&nbsp;Wyott&nbsp;Drive, Suite 100&nbsp;</p>

        <p lang="EN-US">Cheyenne, WY 82002&nbsp;</p>

        <p lang="EN-US">The review of your application should be complete within 30 days.&nbsp;</p>

        <p lang="EN-US">More <a href="https://sites.google.com/a/wyo.gov/doc/home/restoration-of-voting-rights">information is available here</a>.&nbsp;</p>
      '#format': basic_html
    wyoming_new_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="did_you_complete_your_sentence_before_or_after_january_1_2010_wy"]':
            value: New
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!&nbsp;</strong></p>

        <p lang="EN-US">In&nbsp;Wyoming, first-time nonviolent offenders who completed their sentence after January 1, 2010 have their rights automatically restored, enabling you to <strong>register to vote</strong> immediately upon completion of sentence.&nbsp;</p>

        <p lang="EN-US"><a href="https://www.vote.org/register-to-vote/wyoming/">Register to vote with our friends at Vote.org.</a></p>
      '#format': basic_html
  state_district_of_columbia:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: DC
    dc_can_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: DC
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>You can vote!</strong>&nbsp;</p>

        <p>In D.C., no one loses the right to vote for criminal convictions. This is true even if you are currently incarcerated.&nbsp;</p>

        <p><a href="https://www.vote.org/register-to-vote/district-of-columbia/">Register to vote with our friends at Vote.org.</a></p>
      '#format': basic_html
  state_puerto_rico:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: PR
    pr_votes:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: PR
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>You can vote!&nbsp;In&nbsp;Puerto Rico, there are&nbsp;no&nbsp;restrictions on eligibility to vote based on criminal convictions.&nbsp;To register to vote, visit your <a href="http://www.ceepur.org/directorio.htm">local registration office</a>.&nbsp;</p>

        <p>&nbsp;</p>

        <p>&nbsp;</p>
      '#format': basic_html
  iowa_no_vote_sentence_completion_oos:
    '#type': processed_text
    '#states':
      visible:
        ':input[name="was_your_right_restored_in_the_state_of_your_conviction_"]':
          value: 'No'
    '#wrapper_attributes':
      class:
        - message--path-end
    '#text': |
      <p>You are not eligible to vote at this time.</p>

      <p>If you are still serving time on a conviction from another state's court your right to vote will be restored when you complete your sentence, including probation or parole, as long as your conviction was not for homicide OR when your voting rights are restored under the law in the state of your conviction - whichever comes first.</p>
    '#format': basic_html
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit_hide': true
