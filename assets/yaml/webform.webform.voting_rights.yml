      '#text': '<p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote or to restore your right to vote yet.&nbsp;In&nbsp;Tennessee,&nbsp;people&nbsp;convicted of felonies after May 17, 1981 can petition a court to restore their right to vote but only after they have completed their sentence, including probation and parole, and paid all victim restitution. Petitioners must also be current on the payment of any child support obligations or, if they owe arrears, been compliant with payments for one year.</p>'
