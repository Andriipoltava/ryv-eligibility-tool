            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote right now. Your right to vote will be restored when you are released from prison and complete any probation or parole on your felony conviction(s).</p>
      '#format': basic_html
    north_carolina_probation:
      '#type': webform_buttons
      '#title': 'Are you currently serving probation or parole for a felony conviction?'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
      '#states':
        visible:
          ':input[name="are_you_currently_incarcerated_for_your_felony_conviction_nc"]':
            value: 'No'
