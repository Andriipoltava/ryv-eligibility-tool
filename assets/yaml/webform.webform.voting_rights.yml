      '#text': '<p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote or to restore your right to vote yet.&nbsp;In&nbsp;Tennessee,&nbsp;people&nbsp;convicted of felonies after May 17, 1981 can petition a court to restore their right to vote but only after they have completed their sentence, including probation and parole, paid all victim restitution. Petitioners must also be current on the payment of any child support obligations or if they owe arrears, been compliant on payments for one year.</p>'
      '#format': basic_html
    tn_restore:
      '#type': processed_text
      '#states':
        visible:
          - ':input[name="tn_current_on_your_payment_of_any_child_support_obligation"]':
              value: 'Yes'
