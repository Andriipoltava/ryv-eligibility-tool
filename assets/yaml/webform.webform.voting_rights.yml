        <p>Unfortunately, you are&nbsp;<strong>not</strong>&nbsp;eligible to vote right now. In&nbsp;Iowa, if you've been convicted of homicide, you apply to restore your voting rights after you've completed your sentence and if you owe no fines, fees, or restitution or if you are current on a payment plan.</p>

