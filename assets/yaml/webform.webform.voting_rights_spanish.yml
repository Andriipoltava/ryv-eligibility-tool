      '#text': |
        <p><strong>¡Puede votar! </strong>Para inscribirse, <a href="https://www.sos.arkansas.gov/uploads/elections/voter_reg_ap_ar_spanish.pdf">llene un formulario de inscripción</a> y envíelo por correo o entréguelo personalmente al <a href="https://www.sos.arkansas.gov/uploads/County_Clerk_Contact_List_-_Rev._1_.23_.2018_.pdf">secretario de su condado</a>.</p>

        <p>En Arkansas, nadie pierde el derecho a votar por delitos menores o cualquier otra condena que no sea un delito grave. Si está en la cárcel o prisión, pero no fue condenado por un delito grave, sigue siendo elegible para votar. Puede votar aunque haya sido acusado de cometer un delito grave.</p>
