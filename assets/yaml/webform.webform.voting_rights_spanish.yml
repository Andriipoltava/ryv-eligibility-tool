      '#text': |
        <ul>
        	<li>Asesinato</li>
        	<li>Homicidio culposo</li>
        	<li>Secuestro</li>
        	<li>Agresión sexual de primer o segundo grado</li>
        	<li>Robo por la fuerza</li>
        	<li>Agresión agravada</li>
        	<li>Estrangulación de un miembro del hogar</li>
        	<li>Secuestro de una aeronave</li>
