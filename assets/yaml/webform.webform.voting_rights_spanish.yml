        <p><span><span><span>Si su resultado es "inconclusive" (no concluyente), también puede pasar por las siguientes preguntas para confirmar si el orden restaure su derecho de voto o contáctarnos en <a href="mailto:restoreyourvote@campaignlegal.org">restoreyourvote@campaignlegal.org</a>.</span></span></span></p>
