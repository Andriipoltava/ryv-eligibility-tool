      '#text': |
        <p><strong>¡Es elegible para presentar una solicitud para recuperar su derecho a votar!</strong></p>

        <p>Puede presentar una solicitud a la oficina del gobernador <a href="https://governor.iowa.gov/sites/default/files/Application%20for%20Restoration%20of%20Voting%20Rights.pdf?utm_medium=email&amp;utm_source=govdelivery">para recuperar su derecho a votar usando este formulario</a>.</p>

        <p>Si necesita ayuda para llenar la solicitud, escríbanos por <a href="mailto:restoreyourvote@campaignlegalcenter.org">correo electrónico</a>.&nbsp;</p>
