    tn_new_law:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: Tennessee
      '#wrapper_attributes':
        class:
          - message--path-end
      '#admin_title': tn_new_law
      '#text': '<p>El proceso de recuperar el derecho al votar en Tennessee ha cambiado. Despues del 2 de mayo de 2025, la única manera de recuperar el derecho de votar en Tennessee es presentar una solicitud ante el circuito del condado donde fue condenado o donde reside.</p><p>Estos cambios no deberían afectar a las personas que ya recuperaron su derecho al voto antes del 2 de mayo de 2025. Si ya recuperó su derecho al voto, pero tiene dificultades para registrarse, contáctenos.</p><p>Además, a partir del 2 de mayo de 2025, ninguna condena por delito grave anterior al 18 de mayo de 1981 afecta el derecho al voto. Si sus únicas condenas por delito grave fueron anteriores a esa fecha, no ha perdido su derecho al voto.</p><p>Para ser elegible para solicitar la recuperacion del derecho al voto, debe haber cumplido su condena, incluyendo la libertad condicional (parole) y la libertad vigilada (probation), y haber pagado la restitucion a las víctimas y las costos de corte, a menos que pueda demostrar que tiene bajos ingresos y no puede pagar. Los solicitantes también deben estar al día en el pago de la manutención infantil. No puede haber sido condenado por ciertos delitos graves durante períodos específicos. Responda las siguientes preguntas para determinar si cumple los requisitos para presentar una petición y recibir instrucciones sobre cómo iniciar el proceso.</p><p>Para obtener más ayuda, contáctenos al (202) 857-0314 o al (888) 306-8683 (llamada gratuita) o por correo electrónico: RestoreYourVote@campaignlegal.org</p>'
      '#format': full_html
    have_you_been_convicted_of_a_felony_tn:
