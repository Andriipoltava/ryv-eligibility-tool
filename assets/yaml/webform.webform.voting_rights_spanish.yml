        <p>Lamentablemente, todavía <strong>no</strong> es elegible para votar. En Wyoming, no es elegible para recuperar su derecho a votar hasta que complete su condena y el periodo de libertad condicional o libertad vigilada. Vuelva a consultar esta página cuando haya completado su condena para más información sobre su derecho a votar.</p>
