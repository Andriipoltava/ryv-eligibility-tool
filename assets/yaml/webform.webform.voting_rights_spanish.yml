      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><a href="https://apps.supremecourt.az.gov/publicaccess/(S(eae5h2zzlrprh5jkuc4jhgij))/caselookup.aspx">Use esta base de datos para encontrar sus condenas en el estado.</a>&nbsp;</p>

        <p>Si desea recibir más apoyo, <a href="mailto:restoreyourvote@campaignlegalcenter.org">comuníquese con Blair</a> para recibir ayuda.</p>
