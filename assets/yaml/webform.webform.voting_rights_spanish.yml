      '#states':
        visible:
          ':input[name="arizona_court_location"]':
            value: Other
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Es posible que sea elegible para recuperar su derecho a votar, pero tiene que hacer el trámite para recuperar sus derechos civiles en el estado donde fue condenado por un delito grave.</p>

        <p>Alternativamente, puede&nbsp;solicitar que se le restablezcan sus derechos civiles.&nbsp;Puede&nbsp;<a href="https://www.azcourts.gov/clerkofcourt/Contact-Us">encontrar el secretario de la corte de su condado aquí</a>.&nbsp;</p>

        <p>Junto con su solicitud, incluya su alta absoluta o documentación de su alta de la libertad vigilada.&nbsp;</p>

        <p>Para el condado de Maricopa, puede <a href="https://superiorcourt.maricopa.gov/media/4214/crrr11fz.pdf">descargar el formulario de solicitud aquí</a>.&nbsp;</p>

        <p>Para todos los demás condados, puede usar el <a href="https://campaignlegal.org/sites/default/files/2018-08/Arizona%20Application%20to%20Restore.pdf">formulario de muestra aquí</a>.&nbsp;</p>

        <p>Si desea recibir más apoyo, comuníquese con <a href="mailto:restoreyourvote@campaignlegalcenter.org">Blair</a> para recibir ayuda.</p>
      '#format': basic_html
    arizona_database:
      '#type': processed_text
