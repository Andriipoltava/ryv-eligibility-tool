        	<li>Robo por allanamiento agravado</li>
        	<li>Abuso sexual de un menor de edad de primer o segundo grado, si un individuo mayor de dieciséis (16) años de edad cometió penetración sexual contra una víctima menor de trece (13) años de edad</li>
        </ul>
