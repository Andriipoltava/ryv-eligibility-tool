  state_alabama:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: Alabama
    al_felony_conviction:
      '#type': webform_buttons
      '#title': '¿Ha sido condenado por un delito grave?'
      '#options':
        'Yes': Sí
        'No': 'No'
        Maybe: 'No sé'
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: Alabama
      '#admin_title': 'ALABAMA Felony Conviction '
    alabama_database_search:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_felony_conviction"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Si necesita ayuda para encontrar su expediente, llame al 202-856-7902 o escríbanos por <a href="mailto:restoreyourvote@campaignlegalcenter.org">correo electrónico</a>.</p>
      '#format': basic_html
    al_votes:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_felony_conviction"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Puede votar!</strong> En Alabama, nadie pierde el derecho a votar por delitos menores o cualquier otra condena que no sea un delito grave. Si está en la cárcel o prisión, pero no fue condenado por ningún delito grave, sigue siendo elegible para votar.</p>

        <p>Para inscribirse para votar por el internet, visite el <a href="https://www.alabamainteractive.org/sos/voter_registration/voterRegistrationWelcome.action">sitio web del Secretario de Estado</a>.</p>

        <p>O, puede <a href="https://www.eac.gov/assets/1/6/Federal_Voter_Registration_SPA.pdf">llenar este formulario</a> y enviarlo a la junta de registradores del condado (<a href="https://www.sos.alabama.gov/alabama-votes/board-of-registrars-all-counties">sus direcciones figuran aqui</a>.)</p>

        <p>Si tiene preguntas o quiere compartir su historia, le pedimos que <a href="mailto:restoreyourvote@campaignlegal.org">nos escriba por correo electrónico</a>.</p>
      '#format': basic_html
    al_moral_turpitude_felonies:
      '#type': webform_buttons
      '#title': '¿Ha sido condenado por uno o más de los siguientes delitos graves? Por favor, desplace hacia abajo para ver todos los delitos graves. (Si ha sido condenado por un intento, conspiracione, o solicitude de un crimen abajo, seleccione "Sí".)'
      '#help': '<p>Por favor, ponga atención al nivel de su <strong>condena porque podría cambiar su elegibilidad para votar</strong>.</p>'
      '#options':
        'Yes': Sí
        'No': 'No'
        Maybe: 'No sé'
        FOS: 'Fui condenado en un corte federal o fuera de Alabama.'
      '#states':
        visible:
          ':input[name="al_felony_conviction"]':
            value: 'Yes'
      '#admin_title': 'ALABAMA Moral Turpitude '
    al_mt_list:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_felony_conviction"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - text-restrict-height
      '#admin_title': 'ALABAMA MT List'
      '#text': '<ul><li>Maltrato de menores agravado</li><li>Robo agravado por engaño</li><li>Acecho agravado</li><li>Agresión (1.er o 2.° grado)</li><li>Tentativa de cometer un delito con explosivos, un dispositivo de destrucción o arma bacteriológica o biológica.</li><li>Bigamia</li><li>Robo por allanamiento (1.er o 2.° grado)</li><li>Inducir la pertenencia a pandillas</li><li>Conspiración de cometer un delito con explosivos, un dispositivo de destrucción o arma bacteriológica o biológica.</li><li>Diseminación o exposición pública de material obsceno que contiene una representación visual de personas menores de 17 años de edad participando en actos obscenos.</li><li>Distribución, posesión con intento de distribuir, producción de, u oferta o acuerdo de distribuir o producir material obsceno</li><li>Violencia doméstica (1.er o 2.° grado)</li><li>Violencia doméstica por estrangulamiento o asfixia</li><li>Maltrato a los ancianos</li><li>Solicitud electrónica de servicios sexuales de un menor</li><li>Poner en peligro el suministro de agua</li><li>Incitar a un menor a entrar en un vehículo con motivos inmorales&nbsp;</li><li>Facilitar la solicitud de conducta sexual ilícita con un menor de edad</li><li>Facilitar la solicitud por el Internet de servicios sexuales de un menor</li><li>Facilitar el traslado de un menor para cometer un acto sexual ilícito</li><li>Delitos graves cometidos contra trabajadores electorales</li><li>Falsificación (1.er o 2.° grado)</li><li>Impedimento u obstrucción durante la detección, desarme o destrucción de un dispositivo o arma de destrucción</li><li>Obstruir el procesamiento judicial de terroristas</li><li>Trata de seres humanos (1.er o 2.° grado)</li><li>Incesto</li><li>Secuestro (1.er o 2.° grado)</li><li>Homicidio culposo</li><li>Asesinato (incluyendo asesinato capital, asesinato sin pena de muerta, asesinato por imprudencia y asesinato calificado)</li><li>Padres o tutores que permiten que sus hijos participen en la producción de materia obscena</li><li>Posesión o posesión con la intención de diseminar material obsceno que contiene una representación visual de personas menores de 17 años de edad participando en actos obscenos.</li><li>Posesión, fabricación, transporte o distribución de un dispositivo de destrucción o arma bacteriológica o biológica</li><li>Posesión, fabricación, transporte o distribución de un detonante, explosivo, veneno o dispositivo falsificado</li><li>Posesión o distribución de un dispositivo falsificado que finge ser un dispositivo de destrucción o arma</li><li>Producción de material obsceno que contiene una representación visual de personas menores de 17 años de edad participando en actos obscenos</li><li>Producción o distribución de un dispositivo o arma de destrucción con la intención de causar lesión o destrucción</li><li>Actos prohibidos en la oferta, venta o compra de valores</li><li>Violación (1.er o 2.° grado)</li><li>Robo por la fuerza (1.er, 2.° o 3.er grado)</li><li>Vender, proporcionar, regalar, entregar o distribuir un dispositivo de destrucción, un arma bacteriológica a una persona menor de 21 años de edad</li><li>Abuso sexual (1.er o 2.° grado)</li><li>Abuso sexual de un menor de 12 años de edad</li><li>Tortura sexual</li><li>Sodomía (1.er o 2.° grado)</li><li>Solicitar o proporcionar apoyo para un acto de terrorismo</li><li>Terrorismo</li><li>Hurto de bienes perdidos (1.er o 2.° grado)</li><li>Hurto de bienes (1.er o 2.° grado)</li><li>Hurto de marcas comerciales o secretos industriales</li><li>Tortura u otro maltrato de un menor de 18 años de edad (maltrato infantil)</li><li>Tráfico de cannabis, cocaína u otras drogas ilegales, o tráfico de anfetamina o metanfetamina&nbsp;</li><li>Trasladarse para reunirse con un menor de edad para cometer un acto sexual ilícito</li><li>Traición</li></ul>'
      '#format': basic_html
    al_no_cerv_list:
      '#type': webform_buttons
      '#title': '¿Ha sido condenado por uno o más de los siguientes delitos graves? ((Por favor, desplace hacia abajo para ver todos los delitos graves))'
      '#options':
        'Yes': Sí
        'No': 'No'
        Maybe: 'No sé'
      '#states':
        visible:
          ':input[name="al_moral_turpitude_felonies"]':
            value: 'Yes'
      '#admin_title': 'ALABAMA No CERV List'
    no_cerv_felonies:
      '#type': processed_text
      '#states':
        visible-slide:
          ':input[name="al_moral_turpitude_felonies"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - text-restrict-height
      '#text': |
        <ul>
        	<li>
        	<p>Asesinato</p>
        	</li>
        	<li>Impugnación</li>
        	<li>Violación</li>
        	<li>Sodomía</li>
        	<li>Abuso sexual</li>
        	<li>Delitos sexuales contra menores</li>
        	<li>Traición</li>
        </ul>
      '#format': basic_html
    al_no_cerv_database:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_no_cerv_list"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Si necesita ayuda para encontrar su expediente, llame al 202-856-7902 o escríbanos por <a href="mailto:restoreyourvote@campaignlegalcenter.org">correo electrónico</a>.</p>
      '#format': basic_html
    al_no_cerv_need_pardon:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_no_cerv_list"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Es posible que pueda recuperar su derecho a votar si solicita un indulto de la Junta de Indultos y Libertad Condicional.</p>

        <p>Para comenzar el proceso de indulto, <a href="https://paroles.alabama.gov/wp-content/uploads/ABPP-3-Pardon-Application.pdf">llene&nbsp;esta solictud y enviela a la Junta de Indultos y Libertad Condicional</a>.</p>
      '#format': basic_html
    mt_database:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_moral_turpitude_felonies"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Si necesita ayuda para encontrar su expediente, llame al 202-856-7902&nbsp;o escríbanos por <a href="mailto:restoreyourvote@campaignlegalcenter.org">correo electrónico</a>.</p>
      '#format': basic_html
    alabama_probation_parole:
      '#type': webform_buttons
      '#title': '¿Ha completado su condena y el periodo de libertad vigilada (<em>probation</em>) o libertad condicional (<em>parole</em>)?'
      '#options':
        'Yes': Sí
        'No': 'No'
      '#states':
        visible:
          ':input[name="al_no_cerv_list"]':
            value: 'No'
      '#admin_title': 'ALABAMA Probation/Parole'
    al_votes_not_mt:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_moral_turpitude_felonies"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Tiene derecho a votar!</strong></p>

        <p>Aunque no haya completado su condena, tenga multas o cuotas impagas o le hayan dicho erróneamente que no puede votar, usted nunca perdió su derecho a votar.</p>

        <p>Para inscribirse para votar por el Internet,<a href="https://www.alabamainteractive.org/sos/voter_registration/voterRegistrationWelcome.action"> visite el sitio web del Secretario de Estado</a>.&nbsp;</p>

        <p>O, puede <a href="https://www.sos.alabama.gov/sites/default/files/voter-pdfs/nvra-2.pdf">llenar este formulario</a> y enviarlo a la junta de registradores del condado (sus direcciones figuran en el formulario).</p>

        <p>Si tiene preguntas o quiere compartir su historia, le pedimos que nos escriba por <a href="mailto:restoreyourvote@campaignlegalcenter.org">correo electrónico</a>.</p>
      '#format': basic_html
    al_no_vote_probation:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="alabama_probation_parole"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Lamentablemente, todavía no es elegible para recuperar su derecho a votar. Será elegible una vez que complete su condena y pague todas las multas, cuotas y restitución que debe.&nbsp;</p>

        <p>Si tiene preguntas, escríbanos por <a href="mailto:restoreyourvote@campaignlegalcenter.org">correo electrónico</a>.</p>
      '#format': basic_html
    al_fines_fees:
      '#type': webform_buttons
      '#title': '¿Debe alguna multa, cuota o restitución de su condena por uno de los delitos graves nombrados anteriormente?'
      '#help': 'Si debe dinero de un delito menor u otro delito grave distinto, conteste que no.'
      '#options':
        'Yes': Sí
        'No': 'No'
        Maybe: 'No sé'
      '#states':
        visible:
          ':input[name="alabama_probation_parole"]':
            value: 'Yes'
      '#admin_title': 'ALABAMA LFOs'
    al_no_vote_lfos:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_fines_fees"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Lamentablemente, actualmente no es elegible para presentar una solicitud para recuperar su derecho a votar. Puede pedirle a la Junta de Indultos y Libertad Condicional (Board of Pardons and Paroles) que reduzca o perdone su deuda.</p>

        <p>Se puede pedir un <span lang="es-419"><span><span>reducción</span></span></span> de deuda por<a href="https://paroles.alabama.gov/wp-content/uploads/ABPP-5-Remission-of-Fine-and-or-Forfeiture-Application.pdf"> llenar este formulario&nbsp;y enviarlo a la Junta de Indultos y Libertad Condicional</a>.</p>

        <p>Si tiene preguntas, escríbanos por <a href="mailto:restoreyourvote@campaignlegalcenter.org">correo electrónico</a>.</p>
      '#format': basic_html
    al_pending_felony:
      '#type': webform_buttons
      '#title': '¿Tiene cargos pendientes por un delito grave'
      '#help': 'Si el cargo es solo por una infracci&oacute;n de tr&aacute;fico o un delito menor, debe contestar que no a esta pregunta.'
      '#options':
        'Yes': Sí
        'No': 'No'
      '#states':
        visible:
          ':input[name="al_fines_fees"]':
            value: 'No'
      '#admin_title': 'ALABAMA Pending Charges'
    al_pending_charge_no_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_pending_felony"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Lamentablemente, actualmente <strong>no</strong> es elegible para presentar una solicitud para recuperar su derecho a votar.&nbsp;</p>

        <p>Una vez que su haya resuelto el cargo en su contra, puede presentar una solicitud para recuperar su derecho a votar.&nbsp;</p>

        <p>Si tiene preguntas, escríbanos por <a href="mailto:restoreyourvote@campaignlegalcenter.org">correo electrónico</a>.</p>

        <p>&nbsp;</p>
      '#format': basic_html
    al_cerv:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_pending_felony"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': '<p>Puede presentar una solicitud para recuperar su derecho a votar <a href="https://paroles.alabama.gov/wp-content/uploads/ABPP-4-CERV-Application-Form-Fillable-1.pdf">por llenar un CERV&nbsp;y enviarlo a la Junta de Indultos y Libertad Condicional de Alabama</a>.</p><p>Si tiene preguntas, necesita ayuda para completar la CERV, o no recibe una respuesta despues de 44 dias&nbsp;escríbanos por <a href="mailto:restoreyourvote@campaignlegalcenter.org">correo electrónico.</a></p>'
      '#format': basic_html
    al_lfos_database:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_fines_fees"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Si necesita ayuda para encontrar su expediente, llame al 202-868-4799 o escríbanos por <a href="mailto:restoreyourvote@campaignlegalcenter.org">correo electrónico</a>.</p>
      '#format': basic_html
    federal_outofstate_contact:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="al_moral_turpitude_felonies"]':
            value: FOS
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Bajo de la ley en Alabama, las condenas en otros estados o en un corte federal solo eliminan el derecho de votar si constituirían uno de los delitos anteriores si hubieran sido condenados en un corte estatal de Alabama. Póngase en <a href="mailto:bbowie@Campaignlegal.org">contacto con Blair</a> en <a href="mailto:bbowie@Campaignlegal.org">bbowie@Campaignlegal.org</a> para averiguar si su delito fuera del estado o federal está descalificando en Alabama.</p>
      '#format': basic_html
  state_nevada:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: Nevada
    have_you_been_convicted_of_a_felony_nv:
      '#type': webform_buttons
      '#title': '¿Ha sido condenado por un delito grave?'
      '#options':
        'Yes': Sí
        'No': 'No'
      '#states':
        visible:
          - ':input[name="were_you_convicted_in_an_nevada_state_court_a_federal_court_a_s"]':
              value: Combo
          - or
          - ':input[name="were_you_convicted_in_an_nevada_state_court_a_federal_court_a_s"]':
              value: Nevada
          - or
          - ':input[name="were_you_convicted_in_an_nevada_state_court_a_federal_court_a_s"]':
              value: Federal
      '#admin_title': 'NEVADA FELONY'
    nv_are_you_currently_incarcerated:
      '#type': webform_buttons
      '#title': "¿Actualmente está en la cárcel o prisión?\_"
      '#options':
        'Yes': Sí
        'No': 'No'
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_nv"]':
            value: 'Yes'
      '#admin_title': 'NEVADA Incarceration'
    nv_votes:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_nv"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Puede votar</strong>! Puede <a href="https://www.nvsos.gov/sosvoterservices/Registration/Step0.aspx">inscribirse para votar por el Internet en el sitio web de la Secretaria de Estado</a>. O, <a href="https://www.eac.gov/assets/1/6/Federal_Voter_Registration_SPA.pdf">use este sitio web para descargar un formulario de inscripción</a> y envíelo por correo al <a href="https://www.nvsos.gov/sos/elections/voters/county-clerk-contact-information">secretario de su condado</a>.</p>

        <p>En Nevada, nadie pierde el derecho a votar por delitos menores, incluso cuando está en la cárcel.</p>

        <p>Si está en la cárcel o prisión, pero no fue condenado por un delito grave, sigue siendo elegible para votar. Puede votar aunque haya sido acusado de cometer un delito grave.</p>

        <p>Si desea más apoyo (¡o quiere compartir su historia de cómo se inscribió para votar!), ¡<a href="mailto:restoreyourvote@campaignlegalcenter.org">escríbanos por correo electrónico</a>!</p>
      '#format': basic_html
    nv_no_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="nv_are_you_currently_incarcerated"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Lamentablemente, todavía <strong>no</strong> es elegible para votar. En Nevada, no puede recuperar su derecho a votar hasta que lo liberen de la cárcel o prisión.</p>

        <p>Si desea recibir más apoyo, comuníquese con <a href="mailto:restoreyourvote@campaignlegalcenter.org">nosotros</a>.</p>
      '#format': basic_html
    nv_votes_post_incarceration:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="nv_are_you_currently_incarcerated"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Puede votar!&nbsp;</strong>Puede <a href="https://www.nvsos.gov/sosvoterservices/Registration/Step0.aspx">inscribirse para votar por el Internet en el sitio web de la Secretaria de Estado</a>. O, <a href="https://www.eac.gov/assets/1/6/Federal_Voter_Registration_SPA.pdf">use este sitio web para descargar un formulario de inscripción</a> y envíelo por correo al <a href="https://www.nvsos.gov/sos/elections/voters/county-clerk-contact-information">secretario de su condado</a>.</p>

        <p>En Nevada, las personas con condenas por delitos graves pueden votar después de ser liberadas de la cárcel o prisión. Puede votar aunque esté en libertad vigilada (<em>probation</em>) o libertad condicional (<em>parole</em>).</p>

        <p>Si desea recibir más apoyo, comuníquese con <a href="mailto:restoreyourvote@campaignlegalcenter.org">nosotros</a>.</p>
      '#format': basic_html
  state_maine:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: Maine
    processed_text_24:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: Maine
      '#wrapper_attributes':
        class:
          - message--path-end
      '#admin_title': 'Help text: Maine'
      '#text': |
        <p><strong>¡Puede votar! </strong> En Maine, <em>no</em> se limita la elegibilidad para votar por tener condenas penales. Puede <a href="https://www.eac.gov/assets/1/6/Federal_Voter_Registration_SPA.pdf"> llenar un formulario de inscripción aquí</a>.</p>

        <p>Para más información sobre cómo votar en Maine, visite el <a href="https://www.maine.gov/sos/cec/elec/voter-info/voterguide.html">sitio web del Secretario de Estado</a>.</p>
      '#format': basic_html
