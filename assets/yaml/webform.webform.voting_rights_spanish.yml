            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Puede votar!</strong> Para inscribirse, <a href="https://www.eac.gov/assets/1/6/Federal_Voter_Registration_SPA.pdf">llene un formulario de solicitud de inscripción</a> y envíelo por correo a la oficina del secretario de la corte circuito del condado (sus direcciones figuran en el formulario de inscripción).&nbsp;</p>

        <p>En Mississippi, las condenas federales o de otros estados NO lo descalifican para votar. Puede inscribirse para votar.</p>
      '#format': basic_html
    ms_convicted_of_one_or_more_of_the_following_categories:
      '#type': webform_buttons
      '#title': '¿Fue condenado por una o más de las siguientes categorías de delitos graves?'
      '#options':
        'Yes': Sí
        'No': 'No'
        Maybe: 'No sé'
      '#states':
        visible:
          ':input[name="mississip_been_convicted_of_a_felony_in_mississippi_state_court"]':
            value: 'Yes'
      '#admin_title': 'MISSISSIPPI List'
    ms_list:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="mississip_been_convicted_of_a_felony_in_mississippi_state_court"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - text-restrict-height
      '#text': |
        <ul>
        	<li>Asesinato</li>
        		<li>Violación&nbsp;</li>
        		<li>Soborno</li>
        		<li>Hurto&nbsp;</li>
        		<li>Incendio premeditado&nbsp;</li>
        		<li>Obtener dinero o bienes por medios fraudulentos</li>
        		<li>Perjurio</li>
        		<li>Falsificación&nbsp;</li>
        		<li>Malversación</li>
        		<li>Bigamia</li>
        		<li>Robo a mano armada</li>
        		<li>Extorsión</li>
        		<li>Delito grave por cheque sin fondos</li>
        		<li>Delito grave por hurto en tiendas</li>
        		<li>Latrocinio</li>
        		<li>Recibir bienes robados</li>
        		<li>Robo por la fuerza</li>
        		<li>Hurto de madera en troza</li>
        		<li>Uso ilícito de un vehículo automotor</li>
        		<li>Estupro</li>
        		<li>Robo de automóvil con intimidación</li>
        		<li>Latrocinio bajo contrato de renta o alquiler&nbsp;</li>
        		<li>Fraude de electores</li>
        </ul>
      '#format': basic_html
    ms_lookup:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="ms_convicted_of_one_or_more_of_the_following_categories"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Si no está seguro que sus condenas por delitos graves corresponden a una de estas categorías, pregúntele al <a href="https://courts.ms.gov/trialcourts/circuitcourt/circuitclerks.pdf">secretario de la corte de circuito de su condado</a> o llame a la línea directa de elecciones de Mississippi: 1-800-829-6786.</p>
      '#format': basic_html
    ms_vote_nondisqualifying:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="ms_convicted_of_one_or_more_of_the_following_categories"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Puede votar!</strong> Para inscribirse, <a href="https://www.eac.gov/assets/1/6/Federal_Voter_Registration_SPA.pdf">llene un formulario de solicitud de inscripción</a> y envíelo por correo a la oficina del secretario de la corte de circuito del condado (sus direcciones figuran en el formulario de inscripción).&nbsp;</p>

        <p>En Mississippi, si no fue condenado por uno de los delitos graves de la lista anterior, puede votar, incluso mientras está en la cárcel o prisión, y mientras está en libertad vigilada (<em>probation</em>) o libertad condicional (<em>parole</em>).&nbsp;</p>

        <p>En Mississippi, nadie pierde el derecho a votar por delitos menores o cualquier otra condena que no sea uno de los delitos graves de la lista anterior. Si no fue condenado por uno de los delitos graves de la lista anterior, puede votar, incluso mientras está en la cárcel o prisión, y mientras está en libertad vigilada o libertad condicional por otra condena.</p>

        <p>Si está en la cárcel o prisión, pero no fue condenado por uno de los delitos graves de la lista, sigue siendo elegible para votar. Puede votar aunque haya sido acusado de cometer uno de los delitos graves de la lista.&nbsp;</p>
      '#format': basic_html
    ms_apply:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="ms_convicted_of_one_or_more_of_the_following_categories"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Lamentablemente, <strong>no</strong> es elegible para votar en este momento. Puede recuperar su derecho a votar si recibe un indulto del gobernador o si un legislador estatal presenta una petición de sufragio individual en su nombre.&nbsp;</p>

        <p>Puede comunicarse con su legislador estatal para averiguar si puede presentar una petición de sufragio individual en su nombre. <a href="http://billstatus.ls.state.ms.us/members/h_roster.pdf">Puede encontrar su representante aquí</a>.</p>

        <p>Para comenzar el proceso de solicitud de un indulto del gobernador, comuníquese con el gobernador por <a href="https://www.ms.gov/node/218">teléfono, correo postal</a> o <a href="governor@govreeves.ms.gov">correo electrónico</a>.</p>

        <p>Si bien Mississippi continúa privando del derecho al voto a las personas con estas condenas, vuelva a consultar en 2024 para conocer los posibles cambios. Un panel de tres jueces del Tribunal de Apelaciones del Quinto Circuito decidió el 4 de agosto de 2023 que el esquema de privación permanente del derecho al voto de Mississippi constituye un castigo cruel e inusual, sin embargo, todo el Quinto Circuito volvió a escuchar este caso el 23 de enero de 2024 para decidir si la ley es constitucional o no. Su decisión aún no ha sido publicada.</p>
      '#format': basic_html
