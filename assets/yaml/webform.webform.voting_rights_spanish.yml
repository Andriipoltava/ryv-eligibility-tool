        <p><span><span><span lang="ES">Por favor sepa que este litigio sigue en marcha y entonces los órdenes de la corte pueden cambiar. Si no está seguro de su estado o posición, por favor regrese a esta pagina o contactanos a <a href="mailto:restoreyourvote@campaignlegal.org">RestoreYourVote@CampaignLegal.org</a>.</span></span></span></p>
