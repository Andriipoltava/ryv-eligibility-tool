        <p>1700 Broadway, Suite 200&nbsp;</p>

        <p>Denver, CO 80290&nbsp;</p>

        <p>En Colorado, nadie pierde el derecho a votar por delitos menores o cualquier otra condena que no sea un delito grave. Si está en la cárcel o prisión, pero no fue condenado por un delito grave, sigue siendo elegible para votar. Puede votar aunque haya sido acusado de cometer un delito grave.</p>
