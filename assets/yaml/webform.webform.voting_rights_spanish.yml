    arizona_combo_switch_and_continue:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="arizona_court_location"]':
            value: Combo
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Debe confirmar su elegibilidad con relación a cada una de sus condenas.&nbsp;</p>

        <p>Si sus condenas son de otro estado y también de Arizona, es posible que sea elegible para recuperar su derecho a votar, pero tiene que hacer el trámite para recuperar sus derechos en el estado donde fue condenado por un delito grave. Vaya al principio de esta página y vuelva a llenar este formulario para ver el proceso del estado donde fue condenado.</p>

        <p>Después de hacerlo, vuelva a este formulario y llene la parte que corresponde a Arizona.&nbsp;</p>

        <p>Si sus condenas son de una corte federal y una corte de Arizona, siga llenando este formulario.&nbsp;</p>

        <p>Si desea recibir más apoyo, comuníquese con <a href="mailto:restoreyourvote@campaignlegalcenter.org">Blair</a> por correo electrónico para recibir ayuda o llame al 202-856-7902.</p>
