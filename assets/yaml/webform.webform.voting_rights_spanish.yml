        <p><strong>¡Puede votar aunque esté en la cárcel del condado! </strong>Para <a href="https://covr.sos.ca.gov/es/?">inscribirse para votar por el Internet, visite este sitio web</a>. También puede solicitar un <a href="http://www.sos.ca.gov/administration/contact-information/">formulario de inscripción de votante en el sitio web del Secretario de Estado</a>&nbsp;o en la <a href="http://www.sos.ca.gov/elections/voting-resources/county-elections-offices/">oficina de elecciones de su condado.</a></p>

        <p>Cuando se inscribe para votar, puede presentar una solicitud para votar por correo.</p>
      '#format': basic_html
    california_you_can_vote_postparole:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="california_currently_incarcerated_for_your_felony_conviction_"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Puede votar! </strong>Para <a href="https://covr.sos.ca.gov/es/?">inscribirse para votar por el Internet, visite este sitio web</a>. O, llene un formulario de inscripción por correo (disponible en la oficina de elecciones de su condado, biblioteca, oficinas del Departamento de Vehículos Automotores o en las oficinas del correo postal) y envíelo por correo o entréguelo a la <a href="https://www.sos.ca.gov/elections/voting-resources/county-elections-offices/">oficina de elecciones del condado</a>.</p>

        <p>Tiene derecho a votar aunque esté en&nbsp;libertad condicional del estado (<em>state parole</em>), libertad vigilada (<em>probation</em>), supervisión obligatoria <em>(mandatory supervision</em>), liberación en la comunidad después de salir de la cárcel o prisión (<em>post-release community release</em>), o liberación supervisada federal (<em>federal supervised release</em>).</p>
      '#format': basic_html
  state_alaska:
