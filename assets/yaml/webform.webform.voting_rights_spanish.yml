        <p>O, <a href="https://dos.myflorida.com/media/693758/dsde39_spa.pdf">descargue un formulario de inscripción</a> y envíelo por correo al supervisor de elecciones de su condado (sus direcciones figuran en el formulario de inscripción).</p>

        <p>Otra opción es inscribirse para votar en cualquier Departamento de Vehículos Automotores (DMV) de Florida, cualquier <a href="https://dos.myflorida.com/elections/for-voters/voter-registration/national-voter-registration-act/">agencia de inscripción de votantes</a> o cualquier oficina del recaudador de impuestos que emita tarjetas de identidad.&nbsp;</p>

        <p>En Florida, nadie pierde el derecho a votar por delitos menores o cualquier condena que no sea por un delito grave. Si está en la cárcel o prisión, pero no fue condenado por ningún delito grave, sigue siendo <strong>elegible para votar</strong>.&nbsp;</p>
      '#format': basic_html
    fl_new_have_you_been_convicted_of_murder_or_a_sexual_offense_:
      '#type': webform_buttons
