      '#text': |
        <p><strong><span><span><span><span>No es elegible a votar bajo el orden ejecutivo de Gobernador Beshear. El orden no aplica a delitos graves Federales o de otros estados. Pero, es elegible para presentar una solicitud para recuperar su derecho a votar, si ha terminado su condena y no tiene deudas </span></span></span></span></strong><span><span><span><span>de multas o restituciones. <a href="https://civilrightsrestoration.ky.gov/Pages/application.aspx">Haga clic aquí para obtener más información sobre el proceso de petición</a>.</span></span></span></span></p>
      '#format': basic_html
    kentucky_can_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="ha_sido_condenado_de_un_delito_grave_en_una_corte_federal_o_una_"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><span><span><span><strong>Puede votar! </strong>El orden ejecutivo de Gobernador Beshear el día 12 de diciembre del 2019 ha reintegrado el derecho de voter a las personas condenados por un delito grave estatal de Kentucky quienes (1) han completado sus condenas, incluyendo libertad vigilada y libertad condicional, (2) no tienen una condena por traición, soborno, o un delito grave violento, y (3) al momento de discarga, no tuvieron alguna acusación formal o cargo pendiente en su contra.</span></span></span></p>

        <p><span><span><span>Para inscribirse, <a href="https://www.vote.org/state/kentucky/">visite este sitio web</a>.</span></span></span></p>
      '#format': basic_html
