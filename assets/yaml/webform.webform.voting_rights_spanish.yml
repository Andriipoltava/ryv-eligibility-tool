      '#text': |
        <p><strong>¡Puede votar! </strong>Para <a href="https://covr.sos.ca.gov/es/?">inscribirse para votar por el Internet, visite este sitio web</a>. O, llene un formulario de inscripción por correo (disponible en la oficina de elecciones de su condado, biblioteca, oficinas del Departamento de Vehículos Automotores o en las oficinas del correo postal) y envíelo por correo o entréguelo a la <a href="http://www.sos.ca.gov/elections/voting-resources/county-elections-offices">oficina de elecciones del condado</a>.</p>

        <p>En California, nadie pierde el derecho a votar por delitos menores o cualquier otra condena que no sea un delito grave. Las condenas de la corte de menores nunca afectan su derecho a votar. Si está en la cárcel o prisión, pero no fue condenado por un delito grave, sigue siendo elegible para votar. Puede votar aunque haya sido acusado de cometer un delito grave.&nbsp;</p>
