    fl_new_vote_all_fines_fees:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_paid_all_of_your_fines_and_fees_"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Puede votar!&nbsp;</strong>Puede <a href="https://registertovoteflorida.gov/home">inscribirse para votar por el Internet en este sitio web</a>.&nbsp;</p>

        <p><span><span><span lang="ES">Bajo la ley actual de Florida, derechos de votar se recuperan automáticamente después que se complete su sentencia, incluyendo cualquier periodo de libertad condicional (probation) o libertad vigilada (parole), si no debe ningunas tarifas, costos de corte, multas o restitución, mientras que su condena no fue por asesinato o un delito sexual.</span></span></span></p>
      '#format': basic_html
    fl_fines_maybe:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_paid_all_of_your_fines_and_fees_"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><span><span><span lang="ES">Use esta <a href="https://campaignlegal.org/sites/default/files/2019-01/Florida Clerks.pdf">lista de Secretarios de Condado (County Clerks) </a>para buscar sus registros de obligaciones financieras legales sin pagar. Tiene que buscar en cada condado donde puede tener una condena. </span></span></span></p>

        <p><span><span><span lang="ES">O puede usar <a href="http://www.fdle.state.fl.us/Criminal-History-Records/Record-Check">esta base de datos para averiguar su estado</a>. Esta base de datos es mantenida por el Departamento de Correcciones del Estado, pues solamente se requiere una búsqueda. Cada búsqueda de los registros del estado entero cuesta $24 y tiene que ser pagado por tarjeta de débito o crédito. </span></span></span></p>

        <p><span><span><span lang="ES">Si no puede determinar si usted debe tarifas, costos de corte, multas, o restitución, o si no puede averiguar la cantidad que debe, puede contactarnos a <a href="mailto:restoreyourvote@campaignlegal.org">RestoreYourVote@campaignlegal.org</a>.</span></span></span></p>
      '#format': basic_html
    processed_text_28:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="fl_new_have_you_completed_your_probation_and_or_parole_"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Use esta&nbsp;<a href="https://campaignlegal.org/sites/default/files/2019-01/Florida%20Clerks.pdf">lista de secretarios de condado&nbsp;</a>para averiguar el estado de su condena sin costo. Tiene que realizar una búsqueda en cada condado donde pueda seguir estando bajo libertad supervisada.</p>

        <p>O, puede usar esta <a href="http://www.fdle.state.fl.us/Criminal-History-Records/Record-Check">base de datos para encontrar el estado de su condena</a>. Esta base de datos pertenece al Departamento de Correcciones del Estado, así que tendrá que hacer una sola búsqueda.&nbsp;Cada consulta de expedientes estatales tiene un costo de $24 y se debe pagar con una tarjeta de débito o crédito.</p>

        <p>Si todavía no está seguro cuál es el estado de su condena o tiene preguntas adicionales, <a href="mailto:restoreyourvote@campaignlegalcenter.org">comuníquese con Blair</a> y haremos todo lo posible para contestar su pregunta.&nbsp;</p>
      '#format': basic_html
    look_up_lfos:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="_puede_pagar_sus_multas_o_restitucion_en_total_antes_de_la_proxi"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><span><span><span lang="ES">Si no sabe cuanto debe, use <a href="https://campaignlegal.org/sites/default/files/2019-01/Florida Clerks.pdf">esta lista de Secretarios de Condado</a> (County Clerks) para buscar sus registros de obligaciones financieras legales sin pagar. Tiene que buscar en cada condado donde puede tener una condena. </span></span></span></p>

        <p><span><span><span lang="ES">O puede usar <a href="http://www.fdle.state.fl.us/Criminal-History-Records/Record-Check">esta base de datos</a> para averiguar su estado. Esta base de datos es mantenida por el Departamento de Correcciones del Estado, pues solamente se requiere una búsqueda. Cada búsqueda de los registros del estado entero cuesta $24 y tiene que ser pagado por targeta de debito o credito. </span></span></span></p>

        <p><span><span><span lang="ES">Si no puede determinar si usted debe multas o restitución, o si no puede averiguar la cantidad que debe (y por lo tanto, si eres capaz de pagar), o si cree que es incapaz de pagar, puede enviar <a href="https://campaignlegal.org/sites/default/files/2020-05/advisory request %281%29.pdf">una solicitud para una opinión asesora</a> sobre su elegibilidad. </span></span></span></p>

        <p><span><span><span lang="ES">Solicitudes deben ser enviados por correo electrónico a <a href="mailto:DivElections@dos.myflorida.com">DivElections@dos.myflorida.com</a>, o por correo a la siguiente dirección:</span></span></span></p>

        <p><span><span>Florida Department of State, Division of Elections Director's Office Room 316, R. A. Gray Building 500 South Bronough Street Tallahassee, FL 32399-0250</span></span></p>

        <p><span><span><span lang="ES">Usted tiene derecho a una respuesta sobre su elegibilidad entre 21 días. Si no recibe una respuesta, tiene el derecho de inscribirse a votar y confiar en esa inscripción a menos y hasta que el estado responde a su solicitud de opinión asesora.&nbsp; </span></span></span></p>
      '#format': basic_html
    fl_must_pay:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_paid_all_of_your_fines_and_fees_"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>No puede votar o inscribirse a votar. </strong>Las personas que&nbsp;deben tarifas, costos de corte, multas, o&nbsp;restitución por&nbsp;un delito grave no deben inscribirse a votar ni&nbsp;deben votar en Florida.</p>

        <p>Florida Rights Restoration Coalition puede ayudar pagar o modificar tarifas, costos, y multas. <a href="https://floridarrc.com/fines/">Puede pedir&nbsp;asistencia&nbsp;aqui.</a></p>
      '#format': basic_html
  state_georgia:
    '#type': container
    '#states':
      visible:
        ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
          value: Georgia
    have_you_been_convicted_of_a_felony_ga:
      '#type': webform_buttons
      '#title': '¿Ha sido condenado por un delito grave?'
      '#help': 'Las leyes de Georgia les quitan el derecho a votar a las personas con condenas por un &ldquo;delito grave de inmoralidad&rdquo;. Lamentablemente, el Secretario de Estado determin&oacute; que todos los delitos graves son de inmoralidad. Por lo tanto, cualquier persona con una condena por delito grave tiene que encargarse de recuperar su derecho a votar.'
      '#options':
        'Yes': Sí
        'No': 'No'
      '#states':
        visible:
          ':input[name="in_what_state_were_you_convicted_of_a_felony_"]':
            value: Georgia
      '#admin_title': 'GEORGIA Felony '
    georgia_votes:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_ga"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Puede votar! </strong>Puede <a href="https://registertovote.sos.ga.gov/GAOLVR/welcometoga.do#no-back-button">visitar este sitio web para inscribirse para votar por el Internet</a>. O, puede inscribirse llenando este <a href="https://www.eac.gov/assets/1/6/Federal_Voter_Registration_SPA.pdf">formulario de inscripción de votante</a> y enviándolo a la dirección indicada en el formulario.&nbsp;</p>

        <p>En Georgia, nadie pierde el derecho a votar por delitos menores o cualquier otra condena que no sea un delito grave. Si está en la cárcel o prisión, pero no fue condenado por ningún delito grave, sigue siendo elegible para votar.</p>
      '#format': basic_html
    _le_aplica_alguna_de_estas_excepciones_:
      '#type': webform_buttons
      '#title': '¿Le aplica alguna de estas excepciones?'
      '#help': '<span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="font-family:&quot;Arial&quot;,sans-serif"><span style="color:#012d3b">Estas son condiciones especiales que no les aplicar&aacute;n a la mayor&iacute;a de las personas.</span></span></span></span>'
      '#options':
        Sí: Sí
        'No': 'No'
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_ga"]':
            value: 'Yes'
      '#admin_title': 'GEORGIA Exceptions'
    georgia_exceptions:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_a_felony_ga"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - text-restrict-height
      '#text': |
        <p><span><span><span><span><span><span lang="ES"><span><span>1. Usted prometió nolo contendere ("no contesto"), incluso si todavía esta completando una condena,</span></span></span></span></span></span></span></span></p>

        <p><span><span><span><span><span><span lang="ES"><span><span>o</span></span></span></span></span></span></span></span></p>

        <p>2.&nbsp;<span><span><span><span>Fue condenado por la Ley de Primer Delincuente (“First Offender Act”) y su condena no ha sido revocada.</span></span></span></span></p>

        <p><span><span><span><span>o</span></span></span></span></p>

        <p>3.&nbsp;<span><span><span><span>Fue condenado por la Ley de Discarga Condicional y su condena no ha sido revocada.</span></span></span></span></p>
      '#format': basic_html
    georgia_votes_exception:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="_le_aplica_alguna_de_estas_excepciones_"]':
            value: Sí
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><span><span><strong><span><span>Puede votar!&nbsp;</span></span></strong></span></span>Puede&nbsp;<a href="https://registertovote.sos.ga.gov/GAOLVR/welcometoga.do#no-back-button">visitar este sitio web para inscribirse para votar por el Internet</a>. O, puede inscribirse llenando este&nbsp;<a href="https://www.eac.gov/assets/1/6/Federal_Voter_Registration_SPA.pdf">formulario de inscripción de votante</a>&nbsp;y enviándolo a la dirección indicada en el formulario.&nbsp;</p>

        <p><span><span><span><span>La ley de Georgia tiene tres excepciones a la regla que un delito grave suspenda el derecho de votar. Su derecho de votar no ha sido revocado si le aplica una de estas condiciones especiales:</span></span></span></span></p>

        <p><span><span><span><span><span><span lang="ES"><span><span>1. Usted prometió nolo contendere ("no contesto"), incluso si todavía esta completando una condena,</span></span></span></span></span></span></span></span></p>

        <p>o</p>

        <p>2.&nbsp;<span><span><span><span>Fue condenado por la Ley de Primer Delincuente (“First Offender Act”) y su condena no ha sido revocada.</span></span></span></span></p>

        <p><span><span><span><span>o</span></span></span></span></p>

        <p><span><span><span><span>3.&nbsp;Fue condenado por la Ley de Discarga Condicional y su condena no ha sido revocada.</span></span></span></span></p>

        <p><span><span><span><span>Si le aplica una de estas condiciones especiales, usted puede votar.</span></span></span></span></p>
      '#format': basic_html
    completed_your_sentence_including_parole_and_probation_ga:
      '#type': webform_buttons
      '#title': '¿Completó su condena y el periodo de libertad (<em>parole</em>) o libertad vigilada (<em>probation</em>)?'
