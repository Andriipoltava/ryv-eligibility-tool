          - message--path-end
      '#text': |
        <p><strong>¡Puede votar!</strong></p>

        <p>El orden ejecutivo de Gobernador Reynolds&nbsp;el día 5 de Julio del 2020&nbsp;ha reintegrado el derecho de voter a las personas condenados por un delito grave&nbsp;quienes (1) han completado sus condenas, incluyendo libertad vigilada y libertad condicional, (2) no tienen una condena por homicidio.</p>

        <p>Para inscribirse,&nbsp;<a href="https://mymvd.iowadot.gov/Account/Login?ReturnUrl=%2FVoterRegistration">visite este sitio web</a>.</p>
      '#format': basic_html
    iowa_maybe_homicide:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="_ha_sido_condenado_por_homicidio_incluye_asesinato_o_homicidio_i"]':
            value: Maybe
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Si es possible que tiene una condena por homicidio, pero no esta seguro, <a href="https://www.iowacourts.state.ia.us/ESAWebApp/DefaultFrame">puede buscar su condena aqu</a>í.</p>

        <p>Si quiere ayuda, por favor contacta&nbsp;Recupere Su Voto a (888) 306-8683 (toll-free) o&nbsp;<a href="mailto:restoreyourvote@campaignlegal.org">RestoreYourVote@CampaignLegal.org</a>.</p>
      '#format': basic_html
  state_kansas:
