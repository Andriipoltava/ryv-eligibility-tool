            value: 'No'
      '#admin_title': 'IOWA Payment Plan'
    iowa_no_vote_fines:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="iowa_current_and_up_to_date_on_a_payment_plan_to_repay_all_re"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Lamentablemente, <strong>no</strong> es elegible para votar en este momento. En Iowa, solo se puede presentar una solicitud para recuperar su derecho a votar después de haber completado su condena y cualquier periodo de libertad vigilada o libertad condicional. También tiene que haber pagado todas las multas, cuotas y restitución o estar al día con su plan de pagos para todas sus multas o restitución obligatorias. Si establece un plan de pagos y se pone al día con los pagos, será elegible para presentar una solicitud para recuperar su derecho a votar.</p>
      '#format': basic_html
    iowa_apply:
      '#type': processed_text
