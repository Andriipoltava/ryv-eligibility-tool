    az_multicourts_helptext:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="arizona_court_location"]':
            value: Multiple
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Si tiene condenas en multiples cortes, debe confirmar su elegibilidad con relación a cada una de sus condenas.&nbsp;</p>

        <p>Si sus condenas son de otro estado y también de Arizona, es posible que sea elegible para recuperar su derecho a votar, pero tiene que hacer el trámite para recuperar sus derechos en el estado donde fue condenado por un delito grave. Vaya al principio de esta página y vuelva a llenar este formulario para ver el proceso del estado donde fue condenado. Después de hacerlo, vuelva a este formulario y llene la parte que corresponde a Arizona. Si tiene condena(s) en otros estados pero tiena sola una condena en Arizona, debe respostar el formulario por el corte estatal de Arizona como si tuviera solo una condena.</p>

        <p>Si sus condenas son de una corte federal y una corte de Arizona, es elegible para presentar una solicitud para recuperar su derecho a votar. &nbsp;Debe presentar la solicitud donde vive actualmente o en el condado donde fue condenado. Para instrucciones y para confirmar su elegibilidad, llene la parte del formulario qu corresponde a Arizona. Responde "no" cuando pregunta si tiene solo una condena.</p>

        <p>Si desea recibir más apoyo, comuníquese con Blair <a href="mailto:restoreyourvote@campaignlegal.org">por correo electrónico</a> para recibir ayuda o llame al 202-856-7902.</p>
