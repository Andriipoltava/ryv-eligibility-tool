      '#text': |
        <p><strong>¡Puede votar! </strong>Para <a href="https://secure.utah.gov/voterreg/index.html">inscribirse para votar por el Internet, visite este sitio web</a>. O, puede <a href="https://www.eac.gov/assets/1/6/Federal_Voter_Registration_SPA.pdf">llenar un formulario de inscripción por correo aquí</a>. Los votantes del condado de Salt Lake pueden <a href="https://elections.utah.gov/Media/Default/Forms/English-Spanish%20Voter%20Registration%20Form.pdf">inscribirse para votar usando este formulario en español</a>.&nbsp;</p>

        <p>En Utah, nadie pierde el derecho a votar por delitos menores o cualquier otra condena que no sea un delito grave. Si está en la cárcel o prisión, pero no fue condenado por un delito grave, sigue siendo elegible para votar. Puede votar aunque haya sido acusado de cometer un delito grave.</p>
      '#format': basic_html
    are_you_currently_incarcerated_for_your_felony_conviction_utah:
