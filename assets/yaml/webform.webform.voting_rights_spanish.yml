    alaska_cant_vote_parole:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="alaska_currently_on_parole_or_probation"]':
            value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Lamentablemente, <strong>no</strong> es elegible para votar en este momento. Recuperará su derecho a votar cuando terminen su libertad condicional y libertad vigilada.</p>
      '#format': basic_html
    alaska_you_can_vote_after_parole:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="alaska_currently_on_parole_or_probation"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Puede votar!</strong> Para <a href="https://voterregistration.alaska.gov/Registration/RegistrationDetails?haveValidAKDL=true">inscribirse para votar por el Internet, visite este sitio web</a>. O, puede <a href="http://www.elections.alaska.gov/doc/forms/C03.pdf">llenar una solicitud de inscripción por correo aquí</a>.</p>

        <p>En Alaska, las personas con condenas por delitos graves que los descalifican para votar, recuperan su derecho a votar después de completar sus condenas. Como usted ya no está en libertad condicional o libertad vigilada, es elegible para votar.&nbsp;</p>

        <p>Para inscribirse para votar exitosamente, prepárese para presentar una copia de sus “papeles de alta” (<em>discharge papers</em>) —o sea pruebas de que completó su condena— cuando se inscriba para votar.</p>
