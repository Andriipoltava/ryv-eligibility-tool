      '#text': |
        <p><strong>¡Puede votar!</strong> Para <a href="https://voterregistration.alaska.gov/Registration/RegistrationDetails?haveValidAKDL=true">inscribirse para votar por el Internet, visite este sitio web</a>. O, puede <a href="http://www.elections.alaska.gov/doc/forms/C03.pdf">llenar una solicitud de inscripción por correo aquí</a>.</p>

        <p>Alaska les quita el derecho a votar a las personas con condenas por delitos graves “de inmoralidad”. Si bien la frase “de inmoralidad” no es muy explícita, el Departamento de Correcciones usa una lista de delitos que se consideran “de inmoralidad”. Como su condena no figura en la lista del Departamento de Correcciones, usted es elegible para votar, aunque esté en la cárcel, en libertad condicional (<em>parole</em>) o libertad vigilada (<em>probation</em>).</p>
