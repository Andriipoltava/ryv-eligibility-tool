      '#format': basic_html
    have_you_paid_all_fines_or_fees_connected_to_your_conviction_ga:
      '#type': webform_buttons
      '#title': '¿Pagó todas las multas relacionadas con su condena?'
      '#help': '<span style="font-size:12pt"><span style="font-family:&quot;Times New Roman&quot;,serif"><span style="background:white"><span style="font-family:&quot;Arial&quot;,sans-serif"><span style="color:#333333">Bajo la ley de Georgia, solamente las multas afectan el derecho de votar. </span></span></span><span lang="ES" style="background:white"><span style="font-family:&quot;Arial&quot;,sans-serif"><span style="color:#333333">Si usted tiene deudas de una restituci&oacute;n, costos, cuotas, recargos o tarifas, pero no multas, o si sus multas fueron canceladas (por ejemplo, las multas impuestas como condici&oacute;n de libertad condicional se cancelan al terminar la libertad condicional), seleccione &quot;S&iacute;&quot;.</span></span></span></span></span>'
      '#options':
        'Yes': Sí
        'No': 'No'
      '#states':
        visible:
          ':input[name="completed_your_sentence_including_parole_and_probation_ga"]':
            value: 'Yes'
      '#admin_title': 'GEORGIA Fines'
    georgia_votes_postconviction:
