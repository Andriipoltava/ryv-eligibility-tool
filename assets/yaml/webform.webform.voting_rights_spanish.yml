      '#text': |
        <p><strong>¡Puede votar! </strong>Para <a href="https://servicearizona.com/webapp/evoter/selectLanguage">inscribirse para votar por el internet, visite este sitio web</a>.&nbsp;</p>

        <p>O, <a href="https://azsos.gov/sites/default/files/voter_registration_form.pdf">envíe un formulario de inscripción por correo</a> al registrador de su condado (sus direcciones figuran en el formulario de inscripción).</p>

        <p>En&nbsp;Arizona, las personas con una sola condena son elegibles para inscribirse para votar inmediatamente cuando completan su condena y cualquier periodo de libertad condicional o libertad vigilada, y pagan todas las restitución relacionadas con la condena.&nbsp;</p>

        <p>Si desea obtener más apoyo (¡o quiere compartir la historia de cómo se inscribió para votar!), comuníquese con <a href="mailto:restoreyourvote@campaignlegalcenter.org">Blair</a>&nbsp;para recibir ayuda.</p>
