    wyoming_vote_out_of_state:
      '#type': processed_text
      '#states':
        visible:
          - ':input[name="was_your_conviction_s_in_wyoming_state_court_federal_court_or_in"]':
              value: Federal
          - or
          - ':input[name="was_your_conviction_s_in_wyoming_state_court_federal_court_or_in"]':
              value: Other
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Es elegible para recuperar su derecho a votar!</strong> Cuando reciba su solicitud, el Departamento de Correcciones <em>tiene que</em> emitir un certificado reestableciendo su derecho a votar.</p>

        <p>Para presentar la solicitud, necesitará una copia de su fallo y sentencia para su(s) condena(s), y documentación de haber completado su condena. Una vez que haya reunido esos documentos, debe <a href="https://docs.google.com/a/wyo.gov/viewer?a=v&amp;pid=sites&amp;srcid=d3lvLmdvdnxkb2N8Z3g6MTlkMjQxOTI3ZWEyZDA4OA">presentar esta solicitud</a>, al Departamento de Correcciones de Wyoming:</p>

        <p lang="EN-US">Wyoming Department of Corrections&nbsp;<br />
        Attn: Field Services Administrator&nbsp;<br />
        1934&nbsp;Wyott&nbsp;Drive, Suite 100&nbsp;<br />
        Cheyenne, WY 82002&nbsp;</p>

        <p>La revisión de su solicitud se debería completar dentro de los 30 días.</p>

        <p><a href="https://sites.google.com/a/wyo.gov/doc/home/restoration-of-voting-rights">Puede obtener más información en el sitio web del Departamento de Correcciones</a>.</p>
      '#format': basic_html
    did_you_complete_your_sentence_before_or_after_january_1_2010_wy:
      '#type': webform_buttons
      '#title': '¿Completó su condena el o antes del 1.o de enero de 2010?'
      '#options':
        Old: 'Antes del 1.o de enero de 2010'
        New: 'El o después del 1.o de enero de 2010'
      '#states':
        visible:
          ':input[name="was_your_conviction_s_in_wyoming_state_court_federal_court_or_in"]':
            value: Wyoming
      '#admin_title': 'WYOMING Date'
    wyoming_vote_restore:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="did_you_complete_your_sentence_before_or_after_january_1_2010_wy"]':
            value: Old
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Es elegible para recuperar su derecho a votar!</strong> Cuando reciba su solicitud, el Departamento de Correcciones <em>tiene que</em> emitir un certificado reestableciendo su derecho a votar.</p>

        <p>Para presentar la solicitud, necesitará una copia de su fallo y sentencia para su(s) condena(s), y documentación de haber completado su condena. Una vez que haya reunido esos documentos, debe <a href="https://docs.google.com/a/wyo.gov/viewer?a=v&amp;pid=sites&amp;srcid=d3lvLmdvdnxkb2N8Z3g6MTlkMjQxOTI3ZWEyZDA4OA">presentar esta solicitud</a>, al Departamento de Correcciones de Wyoming:</p>

        <p lang="EN-US">Wyoming Department of Corrections</p>

        <p lang="EN-US">Attn: Field Services Administrator</p>

        <p lang="EN-US">1934&nbsp;Wyott&nbsp;Drive, Suite 100</p>

        <p lang="EN-US">Cheyenne, WY 82002</p>

        <p>La revisión de su solicitud se debería completar dentro de los 30 días.</p>

        <p><a href="https://sites.google.com/a/wyo.gov/doc/home/restoration-of-voting-rights">Puede obtener más información en el sitio web del Departamento de Correcciones</a>.</p>
      '#format': basic_html
    wyoming_new_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="did_you_complete_your_sentence_before_or_after_january_1_2010_wy"]':
            value: New
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Puede votar! </strong><a href="http://soswy.state.wy.us/Forms/Elections/General/VoterRegistrationForm.pdf">Puede descargar un formulario de inscripción</a> y llevarlo personalmente para firmar en la oficina del secretario de su condado (sus direcciones figuran en el formulario de inscripción). O, puede notarizar su firma y enviar su formulario de inscripción por correo al secretario del condado.&nbsp;</p>

        <p>En Wyoming, las personas condenadas por primera vez de delitos no violentos que completaron sus condenas después del 1.o de enero de 2010 recuperan sus derechos automáticamente; por lo tanto, puede inscribirse para votar inmediatamente después de completar su condena.</p>
      '#format': basic_html
