              value: 'Yes'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p>Lamentablemente, <strong>no</strong> es elegible para votar en este momento. Recuperará su derecho a votar cuando termine su condena y el periodo de libertad condicional (<em>parole</em>), libertad vigilada (<em>probation</em>) o supervisión extendida (<em>extended supervision</em>).</p>
      '#format': basic_html
    yes_you_can_vote:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="have_you_been_convicted_of_treason_or_bribery_wisconsin"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Puede votar!</strong> Para <a href="https://myvote.wi.gov/es-ES/RegisterToVote">inscribirse para votar por el Internet, visite este sitio web</a>. O, puede <a href="https://elections.wi.gov/sites/electionsuat.wi.gov/files/2019-01/EL-131%20Voter%20Registration%20App-Spanish%20(REV-2018-10)%20Fillable%20POR%20update.pdf">llenar un formulario de inscripción</a> y enviarlo por correo o entregarlo personalmente al <a href="https://myvote.wi.gov/es-ES/MyMunicipalClerk">funcionario de elecciones de su condado</a>.&nbsp;</p>

        <p>En Wisconsin, nadie pierde el derecho a votar por delitos menores o cualquier otra condena que no sea un delito grave (además de traición y soborno). Si está en la cárcel o prisión, pero no fue condenado por un delito grave, sigue siendo elegible para votar. Puede votar aunque haya sido acusado de cometer un delito grave.</p>
      '#format': basic_html
    yes_you_can_vote_parole:
      '#type': processed_text
      '#states':
        visible:
          ':input[name="are_you_currently_on_probation_or_on_parole_"]':
            value: 'No'
      '#wrapper_attributes':
        class:
          - message--path-end
      '#text': |
        <p><strong>¡Puede votar!</strong> Para <a href="https://myvote.wi.gov/es-ES/RegisterToVote">inscribirse para votar por el Internet, visite este sitio web</a>. O, puede <a href="https://elections.wi.gov/sites/electionsuat.wi.gov/files/2019-01/EL-131%20Voter%20Registration%20App-Spanish%20(REV-2018-10)%20Fillable%20POR%20update.pdf">llenar un formulario de inscripción</a> y enviarlo por correo o entregarlo personalmente al <a href="https://myvote.wi.gov/es-ES/MyMunicipalClerk">funcionario de elecciones de su condado</a>.</p>

        <p>Las personas con condenas previas recuperan su derecho a votar inmediatamente cuando completan su condena y el periodo de libertad condicional, libertad vigilada y supervisión extendida.</p>
      '#format': basic_html
