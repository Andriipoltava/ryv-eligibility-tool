        <p>O, puede usar esta <a href="http://www.fdle.state.fl.us/Criminal-History-Records/Record-Check">base de datos para encontrar el estado de su condena</a>. Esta base de datos pertenece al Departamento de Correcciones del Estado, así que tendrá que hacer una sola búsqueda. Cada consulta de los expedientes estatales tiene un costo de $24 y se debe pagar con una tarjeta de débito o crédito.&nbsp;</p>

        <p>Para obtener más ayuda,&nbsp;<a href="mailto:restoreyourvote@campaignlegalcenter.org">escríbale a Blair por correo electrónico</a>.&nbsp;</p>
