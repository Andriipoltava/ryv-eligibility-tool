        class:
          - message--path-end
      '#text': |
        <p>Lamentablemente, <strong>no</strong> es elegible para votar en este momento. Recuperará su derecho a votar cuando complete su condena y el periodo de libertad condicional (<em>parole</em>) o libertad vigilada (<em>probation</em>).</p>
