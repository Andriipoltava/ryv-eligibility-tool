      '#text': |
        <p><strong>¡Es elegible para recuperar su derecho a votar!</strong> Solo debe completar algunos pasos finales.</p>

        <p>Primero:</p>

        <p>Reúna pruebas de haber completado su condena por delito grave y el periodo de libertad vigilada o condicional, y de haber pagado todas las multas y cuotas relacionadas con sus condenas por delitos graves.</p>

        <p>Si no tiene esos documentos, comuníquese con el Departamento de Correcciones (870-267-6999), el Departamento de Corrección Comunitario (501-682-9510) o la oficina de libertad vigilada de su zona para solicitar pruebas/documentación de haber completado su condena y haber pagado todas las cuotas, costos de la corte, multas y restitución.</p>

        <p>Estas agencias tienen el deber legal de proporcionarle esta documentación.</p>

        <p>Segundo:</p>

        <p>Entregue sus pruebas de haber completado su condena junto con un <a href="https://www.sos.arkansas.gov/uploads/elections/voter_reg_ap_ar_spanish.pdf">formulario de inscripción de votante</a> al <a href="https://www.sos.arkansas.gov/uploads/County_Clerk_Contact_List_-_Rev._1_.23_.2018_.pdf">secretario de su condado</a>.</p>

        <p>Puede enviar el formulario y pruebas de haber completado todos los requisitos por correo al secretario del condado o entregárselos personalmente.</p>
