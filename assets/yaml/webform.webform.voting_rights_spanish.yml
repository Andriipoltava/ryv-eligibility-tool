      '#text': '<p><strong>¡Puede votar! &nbsp;</strong>A partir del 2 de mayo de 2025, ninguna condena por delito grave anterior al 18 de mayo de 1981 afecta el derecho al voto. Si sus únicas condenas por delito grave fueron anteriores a esa fecha, no ha perdido su derecho al voto.</p><p>Puede <a href="https://ovr.govote.tn.gov/">visitar este sitio web para inscribirse para votar por el Internet</a>. O, <a href="https://www.eac.gov/assets/1/6/Federal_Voter_Registration_SPA.pdf">descargar el formulario de inscripción</a> y enviarlo por correo al <a href="https://tnsos.org/elections/election_commissions.php">funcionario de elecciones de su condado</a>.&nbsp;</p><p>Si la tiene, le puede convenir incluir documentación de sus condenas anteriores para mostrar que no lo descalifican para votar y confirmar que su inscripción se tramite debidamente.</p>'
