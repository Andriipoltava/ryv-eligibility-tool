      '#text': |
        <p>Lamentablemente,&nbsp;<strong>no</strong>&nbsp;es elegible para votar en este momento. Bajo la ley de Georgia, recuperará su derecho a votar cuando termine su condena y cualquier periodo de libertad condicional y libertad vigilada, y paga algunas multas.</p>

        <p>Si le informan que no es elegible aunque haya completado el periodo de libertad condicional y libertad vigilada debido a una multa impaga, le pedimos que nos escriba por&nbsp;<a href="mailto:restoreyourvote@campaignlegalcenter.org">correo electrónico</a>.</p>
