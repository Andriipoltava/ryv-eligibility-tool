      '#text': |
        <p><strong>¡Puede votar! </strong>Para <a href="https://servicearizona.com/webapp/evoter/selectLanguage">inscribirse para votar por el internet, visite este sitio web</a>.&nbsp;</p>

        <p>O, <a href="https://azsos.gov/sites/default/files/voter_registration_form.pdf">envíe un formulario de inscripción por correo</a> al registrador de su condado (sus direcciones de figuran en el formulario de inscripción).&nbsp;</p>

        <p>En Arizona, nadie pierde el derecho a votar por delitos menores o cualquier otra condena que no sea un delito grave. Si está en la cárcel o prisión, pero no fue condenado por un delito grave, sigue siendo elegible para votar. Puede votar aunque haya sido acusado de cometer un delito grave.</p>

        <p>Si desea recibir más apoyo, <a href="mailto:restoreyourvote@campaignlegalcenter.org">comuníquese con Blair</a> para recibir ayuda.</p>
