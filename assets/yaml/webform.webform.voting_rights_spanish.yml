      '#text': |
        <p><span><span><span>Cualquier ofensa capital;</span></span></span></p>

        <p><span><span><span>Cualquier delito grave de clase A;</span></span></span></p>

        <p><span><span><span>Cualquier delito grave de Clase B que implique la muerte de la víctima, o lesiones o heridas físicas graves a una víctima</span></span></span><span><span><span>;</span></span></span></p>

        <p><span><span><span>Cualquier delito grave de Clase B que implique intento de asesinato si la víctima del delito es un oficial de paz o bombero claramente identificable quien actúa en el cumplimiento de su deber oficial, independientemente de si se produce una lesión&nbsp;(KRS 506.010);</span></span></span></p>

        <p><span><span><span>Cualquier delito sexual grave&nbsp;(KRS 510);</span></span></span></p>

        <p><span><span><span>Cualquier intento de delito sexual grave&nbsp;(KRS 510);</span></span></span></p>

        <p><span><span><span>Agresion 1er o 2o grado&nbsp;(KRS 508.020);</span></span></span></p>

        <p><span><span><span>Agresion bajo trastorno emocional extremo&nbsp;(KRS 508.040(a));</span></span></span></p>

        <p><span><span><span>Soborno en una elección&nbsp;(KRS 521);</span></span></span></p>

        <p><span><span><span>Robo 1er grado, acompañado por comisión o intento de cometer agresión descrito en KRS 508.010, 508.020, 508.032, or 508.060;</span></span></span></p>

        <p><span><span><span>Robo 1er grado, acompañado por comisión o intento de cometer de secuestro&nbsp;(KRS 509.040);</span></span></span></p>

        <p><span><span><span>Abuso criminal 1er grado&nbsp;</span></span></span><span><span><span>(KRS 508.100);</span></span></span></p>

        <p><span><span><span>Homicidio fetal 1er, 2º, 3º, 4º grado&nbsp;(KRS 507A);</span></span></span></p>

        <p><span><span><span>Trata de personas&nbsp;(KRS 529.100);</span></span></span></p>

        <p><span><span><span>Homicidio culposo 1er o 2o grado (KRS 507.030-.040);</span></span></span></p>

        <p><span><span><span>Asesinato&nbsp;(KRS 507.020);</span></span></span></p>

        <p><span><span><span>Promover el desempeño sexual de un menor&nbsp;(KRS 531.320);</span></span></span></p>

        <p><span><span><span>Transacción ilegal con un menor 1er grado&nbsp;(KRS 530.064(1)(a));</span></span></span></p>

        <p><span><span><span>Uso de un menor en una actuación sexual&nbsp;(KRS 531.310);</span></span></span></p>

        <p><span><span><span>Homicidio temerario&nbsp;(KRS 507.050);</span></span></span></p>

        <p><span><span><span><span><span><span><span><span>Robo por la fuerza 1er grado&nbsp;</span></span></span></span></span>(KRS 515.020);</span></span></span></p>
      '#format': basic_html
