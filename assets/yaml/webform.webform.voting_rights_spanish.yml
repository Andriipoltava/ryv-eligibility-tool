      '#text': |
        <p>Use esta&nbsp;<a href="https://campaignlegal.org/sites/default/files/2019-01/Florida%20Clerks.pdf">lista de secretarios de condado&nbsp;</a>para averiguar el estado de su condena sin costo. Tiene que realizar una búsqueda en cada condado donde pueda seguir estando bajo libertad supervisada.</p>

        <p>O, puede usar esta <a href="http://www.fdle.state.fl.us/Criminal-History-Records/Record-Check">base de datos para encontrar el estado de su condena</a>. Esta base de datos pertenece al Departamento de Correcciones del Estado, así que tendrá que hacer una sola búsqueda.&nbsp;Cada consulta de expedientes estatales tiene un costo de $24 y se debe pagar con una tarjeta de débito o crédito.</p>

        <p>Si todavía no está seguro cuál es el estado de su condena o tiene preguntas adicionales, <a href="mailto:restoreyourvote@campaignlegalcenter.org">comuníquese con Blair</a> y haremos todo lo posible para contestar su pregunta.</p>
      '#format': basic_html
