          - message--path-end
      '#text': |
        <p><span><span><span>Todas las personas que tienen condenados por delitos graves pierden el derecho de votar en Virginia y el derecho solo puede estar recuperado por clemencia del gobernador. En el pasado, los gobernadores han reintegrado el derecho de votar automáticamente cuando la gente terminaba su pena. Gobernador Youngkin cambió la norma y ahora exige una&nbsp;</span></span></span>solicitud<span><span><span> por cada persona. Sí usted terminó su pena antes de enero 2023, es posible que ya haya recuperado su derecho de votar, pero necesitar</span></span></span>í<span><span><span>a confirmar por el portal del <a href="https://www.restore.virginia.gov/">secretario de mancomunidad aquí.</a></span></span></span></p>

        <p><span><span><span>Sí el portal dice que usted no ha recuperado su derecho de votar, <a href="https://cov-ror.azurewebsites.net/Search">puede presentar una solictud por el portal también.</a> </span></span></span></p>

        <p><span><span><span>Sí tiene preguntas o problemas, contáctanos a <a href="mailto:RestoreYourVote@campaignlegal.org">RestoreYourVote@campaignlegal.org</a>. </span></span></span></p>
